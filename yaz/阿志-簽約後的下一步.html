function b64(s){var r=atob(s),u=new Uint8Array(r.length);for(var i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u}
function bs(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function err(t){document.getElementById('gerr').textContent=t}
async function dec(raw){var k=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);
return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(E.i)},k,b64(E.c)))}
function show(h){function w(){document.open();document.write(h);document.close()}if(document.readyState==='complete')w();else window.addEventListener('load',function(){setTimeout(w,0)})}
if(!(window.crypto&&crypto.subtle)){err('此瀏覽器不支援安全解密，請改用 Safari／Chrome 最新版開啟。');return}
try{var s=JSON.parse(localStorage.getItem(K)||'null');if(s&&s.k&&s.exp>Date.now()){dec(b64(s.k)).then(show).catch(function(){try{localStorage.removeItem(K)}catch(e){}})}}catch(e){}
var busy=false;
async function go(){if(busy)return;var pw=document.getElementById('gpw').value.replace(/\s+/g,'');if(!pw){err('請輸入通行碼。');return}
busy=true;err('驗證中…');try{var bk=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);

show(h)}catch(e){err('通行碼不正確，請再試一次。')}busy=false}
