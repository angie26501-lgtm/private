var raw=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(E.s),iterations:E.n,hash:'SHA-256'},bk,256));
var h=await dec(raw);try{if(document.getElementById('grem').checked)localStorage.setItem(K,JSON.stringify({k:bs(raw),exp:Date.now()+30*864e5}))}catch(e){}
show(h)}catch(e){err('通行碼不正確，請再試一次。')}busy=false}
document.getElementById('gbtn').onclick=go;document.getElementById('gpw').addEventListener('keydown',function(e){if(e.key==='Enter')go()});
document.getElementById('eye').onclick=function(){var p=document.getElementById('gpw'),v=p.type==='password';p.type=v?'text':'password';this.textContent=v?'隱藏':'顯示'};
})();
</script>
