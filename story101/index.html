<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow, noarchive">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>101夜傳承秘境｜財富傳承故事</title>
<style>
:root{
  --night:#0f1433; --night2:#1b2150; --lapis:#2a3f8f; --sand:#e9d2a0; --sand2:#c9a76b;
  --gold:#e8b64c; --gold2:#ffd982; --papyrus:#f6ead0; --ink:#2b2316; --sub:#7a6a4f;
  --ruby:#b8323a; --emerald:#2f8f6b; --stone:#3a3f63;
  --serif:"Noto Serif TC","Source Han Serif TC","PMingLiU","Songti TC",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;color:var(--papyrus);font-family:var(--sans);line-height:1.75;
  background:radial-gradient(ellipse at 50% -10%,#3a3f8f 0%,var(--night2) 35%,var(--night) 75%) fixed}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff8,transparent),radial-gradient(1px 1px at 33% 8%,#fff9,transparent),
  radial-gradient(1.5px 1.5px at 58% 22%,#fff7,transparent),radial-gradient(1px 1px at 78% 12%,#fffa,transparent),
  radial-gradient(1px 1px at 90% 30%,#fff8,transparent),radial-gradient(1.5px 1.5px at 22% 40%,#fff6,transparent),
  radial-gradient(1px 1px at 68% 44%,#fff7,transparent),radial-gradient(1px 1px at 45% 33%,#fff9,transparent)}
#app{position:relative;z-index:1}

/* ===== 首頁 Hero ===== */
.hero{position:relative;text-align:center;padding:36px 0 0;overflow:hidden}
.moon{position:absolute;top:22px;right:9%;width:64px;height:64px;border-radius:50%;box-shadow:-14px 8px 0 0 var(--gold2);transform:rotate(-20deg)}
.hero .k{font-size:14px;letter-spacing:.4em;color:var(--gold2)}
.hero .num{font-weight:900;font-size:clamp(72px,16vw,150px);line-height:.95;
  background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#a8742a);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 40px rgba(232,182,76,.25)}
.hero .num .ye{font-family:var(--serif);font-weight:900;font-size:.62em;margin-left:.08em;vertical-align:.08em}
.hero .t1{font-family:var(--serif);font-weight:900;font-size:clamp(26px,5vw,44px);letter-spacing:.12em;margin-top:2px}
.hero .t2{display:inline-block;margin:10px 0 6px;padding:4px 22px;border:1px solid var(--gold);color:var(--gold2);
  font-family:var(--serif);font-size:clamp(18px,3vw,22px);letter-spacing:.5em;border-radius:4px}
.hero .lead{font-family:var(--serif);color:var(--sand);font-size:clamp(15px,2.4vw,18px);margin:10px auto 4px;max-width:640px}
.hero .who{font-size:13.5px;color:var(--sand2)}
.dunes{display:block;width:100%;height:110px;margin-top:18px}

/* ===== 勇者面板 ===== */
.hud{margin:-6px 0 22px;background:linear-gradient(180deg,#2a2440,#1d1a33);border:1px solid #5b4a2a;border-radius:16px;
  padding:16px 18px;display:grid;gap:12px;box-shadow:0 0 0 3px rgba(232,182,76,.08) inset}
.hud-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.avatar{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:28px;
  background:radial-gradient(circle,#5b3f8f,#2a1f4a);border:2px solid var(--gold)}
.rank{font-family:var(--serif);font-weight:700;font-size:19px;color:var(--gold2)}
.rank small{display:block;font-family:var(--sans);font-weight:400;font-size:13px;color:var(--sand2)}
.stats{margin-left:auto;display:flex;gap:16px;font-size:14px;color:var(--sand)}
.stats b{color:var(--gold2);font-size:20px;margin-right:2px}
.xpbar{height:12px;border-radius:99px;background:#0d1028;border:1px solid #5b4a2a;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a8742a,var(--gold2));transition:width .7s}
.titles{display:flex;gap:6px;flex-wrap:wrap}
.tt{font-size:12.5px;padding:3px 10px;border-radius:99px;border:1px dashed #5b4a2a;color:#9a8a6a}
.tt.on{border:1px solid var(--gold);color:var(--gold2);background:rgba(232,182,76,.12)}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--gold);background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2b1d05;font-weight:700;
  border-radius:99px;padding:9px 18px;font-size:15px}
.btn.ghost{background:transparent;color:var(--gold2)}
.lamp-tip{font-size:13px;color:var(--sand2)}

/* ===== 篩選 ===== */
.sect-t{font-family:var(--serif);font-size:22px;color:var(--gold2);margin:4px 0 4px}
.sect-s{font-size:13.5px;color:var(--sand2);margin-bottom:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid #4a4470;background:#1d1a33;color:var(--sand);border-radius:99px;padding:6px 12px;font-size:13.5px}
.chip.on{border-color:var(--gold);color:#2b1d05;background:var(--gold2)}
.search{width:100%;padding:11px 14px;border-radius:10px;border:1px solid #4a4470;background:#14183a;color:var(--papyrus);font-size:15px;margin-bottom:14px}
.mt-card{background:linear-gradient(135deg,#2e2550,#1d1a33);border:1.5px solid var(--gold);border-radius:14px;padding:14px 16px;margin:0 0 14px}
.mt-h{font-weight:800;color:#ffd982;font-size:16.5px}.mt-s{font-size:13.5px;color:var(--sand2);margin:4px 0 10px;line-height:1.6}
.mtx{width:100%;box-sizing:border-box;min-height:120px;border-radius:12px;border:1.5px solid var(--gold);background:#0f0c22;color:#fff;padding:12px;font-size:15px;line-height:1.7;font-family:inherit}
.mtex{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.mtr{display:block;width:100%;text-align:left;background:#14183a;border:1px solid #4a4470;border-radius:12px;padding:10px 12px;margin:8px 0;color:var(--papyrus);cursor:pointer;font-family:inherit;font-size:14.5px;line-height:1.55}
.mtr:hover{border-color:var(--gold)}.mtr .sc{float:right;color:#ffd982;font-size:12.5px}
.mtr .why{display:block;margin-top:4px;font-size:12.5px;color:#c9bd9d}
.mtr .why i{font-style:normal;background:rgba(233,169,42,.18);color:#ffd982;border-radius:99px;padding:1px 8px;margin-right:4px}
.kwhot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-6px 0 6px;font-size:13px;color:var(--sand2)}
.kwc{border:1px solid #6a5a35;background:transparent;color:var(--papyrus);border-radius:99px;padding:4px 11px;font-size:13px;cursor:pointer;font-family:inherit}
.kwc.on,.kwc:hover{background:#e9a92a;color:#2b2316;border-color:#e9a92a}
.kwtip{font-size:12.5px;color:#a79fc4;margin:0 0 14px;line-height:1.6}.kwtip b{color:#ffd982}
.search::placeholder{color:#8a83aa}

/* ===== 101 石室 ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding-bottom:40px}
.room{position:relative;text-align:left;border-radius:14px 14px 6px 6px;padding:12px 12px 12px;min-height:150px;display:flex;flex-direction:column;gap:4px;
  background:linear-gradient(180deg,#e9d2a0,#c9a76b);color:var(--ink);border:2px solid #8a6a32;
  box-shadow:0 4px 0 #6b4f22;transition:transform .15s}
.room:hover{transform:translateY(-3px)}
.room .no{font-weight:900;font-size:12.5px;color:#6b4f22;letter-spacing:.05em}
.room .mon{font-size:30px;line-height:1.1}
.room .nm{font-size:12px;color:#6b4f22}
.room .ti{font-family:var(--serif);font-weight:700;font-size:14px;line-height:1.45}
.room .lv{margin-top:auto;font-size:11.5px;color:#8a3a20}
.room.win{background:linear-gradient(180deg,#d8e6cf,#9fbf8f);border-color:#4f7a3a;box-shadow:0 4px 0 #3a5a2a}
.room .seal{position:absolute;top:8px;right:8px;font-size:11px;font-weight:700;color:#fff;background:var(--emerald);border-radius:99px;padding:1px 8px}
.demo{display:inline-block;font-size:10.5px;color:#fff;padding:0 6px;border-radius:4px;width:fit-content;background:#6b4f22}
.demo.k-news{background:#8a3a20}
.srcline{background:#efe0bd;border-left:4px solid #c9a76b;border-radius:6px;padding:8px 12px;font-size:13px;color:#5e4a33;margin-bottom:12px;line-height:1.7}
.room.locked{background:repeating-linear-gradient(45deg,#2a2d50,#2a2d50 8px,#262948 8px,#262948 16px);
  border:2px solid #3a3f63;box-shadow:0 4px 0 #1b1e3a;color:#6f6a96;cursor:default;align-items:center;justify-content:center;text-align:center}
.room.locked:hover{transform:none}
.room.locked .no{color:#8a83aa}

/* ===== 戰鬥頁 ===== */
.battle{max-width:780px;margin:0 auto;padding:20px 16px 64px}
.back{background:none;border:0;color:var(--sand2);font-size:15px;padding:6px 0}
.arena{margin-top:10px;border-radius:18px;padding:18px;text-align:center;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#2a2d6a 0%,#3b2f5a 55%,#7a5a2e 56%,#c9a76b 100%);border:2px solid #5b4a2a}
.arena .cno{font-weight:900;color:var(--gold2);letter-spacing:.1em;font-size:14px}
.monster{font-size:84px;line-height:1.1;margin:8px 0 2px;display:inline-block;transition:transform .2s,opacity .6s,filter .6s}
.monster.hit{animation:hit .4s}
.monster.dead{opacity:.15;filter:grayscale(1);transform:scale(.6) rotate(-20deg)}
@keyframes hit{0%,100%{transform:translateX(0)}25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.mname{font-family:var(--serif);font-weight:900;font-size:22px;color:#fff}
.mdesc{font-size:13px;color:var(--sand);margin-bottom:8px}
.hpwrap{max-width:360px;margin:0 auto;text-align:left;font-size:12.5px;color:#fff}
.hp{height:14px;border-radius:99px;background:#1a0d0d;border:1px solid #000;overflow:hidden;margin-top:2px}
.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#e0484f,#ff8a5a);transition:width .6s}
.hearts{margin-top:10px;font-size:20px;letter-spacing:4px}
.arena .hint2{font-size:12.5px;color:#fff;opacity:.85}

.scrollwrap{margin-top:22px;position:relative;padding:0 10px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
.roller{position:relative;height:26px;margin:0 -10px;border-radius:13px;z-index:2;
  background:linear-gradient(180deg,#3d2410 0%,#8a5a2b 30%,#c99a5c 48%,#8a5a2b 68%,#3d2410 100%);
  box-shadow:0 3px 6px rgba(0,0,0,.45)}
.roller::before,.roller::after{content:"";position:absolute;top:-5px;width:22px;height:36px;border-radius:9px;
  background:radial-gradient(circle at 35% 30%,#fff2b8,#e8b64c 35%,#8a5a1a 80%);box-shadow:0 2px 4px rgba(0,0,0,.5)}
.roller::before{left:-12px}.roller::after{right:-12px}
.scroll{color:#3b2a14;padding:26px 24px 30px;position:relative;margin:-6px 0;overflow:hidden;
  background:
    radial-gradient(ellipse at 15% 8%,rgba(255,255,255,.45),transparent 40%),
    radial-gradient(ellipse at 85% 95%,rgba(140,90,30,.22),transparent 55%),
    radial-gradient(ellipse at 90% 20%,rgba(160,110,40,.12),transparent 35%),
    repeating-linear-gradient(0deg,rgba(120,85,35,.035) 0 2px,transparent 2px 6px),
    repeating-linear-gradient(90deg,rgba(120,85,35,.025) 0 1px,transparent 1px 7px),
    #f1e1bb;
  box-shadow:inset 0 0 45px rgba(110,65,15,.38),inset 0 0 10px rgba(80,45,10,.45);
  max-height:0;transition:max-height 1.5s cubic-bezier(.45,.05,.35,1)}
.scroll.done{max-height:none;transition:none}
@media (prefers-reduced-motion:reduce){.scroll{transition:none;max-height:none}}
.scroll::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(90,55,15,.22),transparent 6%,transparent 94%,rgba(90,55,15,.22))}
.scroll>*{position:relative}
.scroll h1{text-align:center;color:#3b2410}
.scroll h1::after{content:"❦　✦　❦";display:block;font-size:15px;letter-spacing:.3em;color:#9a6a2a;margin-top:8px}
.storybox{position:relative;border:2px solid #a8783a;outline:1px solid #a8783a;outline-offset:4px;border-radius:4px;padding:18px 18px 26px;margin:6px 4px 0;
  background:radial-gradient(ellipse at center,rgba(255,250,235,.55),rgba(255,250,235,0) 75%)}
.storybox .story p:first-child::first-letter{float:left;font-size:2.3em;line-height:1.25;padding:2px 9px;margin:6px 10px 0 0;
  color:#8a2a14;font-weight:900;border:2px solid #8a2a14;outline:1px solid #c9a76b;outline-offset:2px;background:rgba(255,246,220,.85)}
.scroll .srcline{background:rgba(255,248,228,.45);border-left-color:#a8783a}
.scroll .meta{background:rgba(255,248,228,.45);border:1px dashed rgba(120,80,30,.4)}
.storybox .story p{text-indent:0;margin:0 0 12px}
.stamp-seal{position:absolute;right:14px;bottom:-18px;width:62px;height:62px;border-radius:8px;transform:rotate(-8deg);
  background:#b3261e;color:#fff6e6;font-family:var(--serif);font-weight:900;font-size:19px;line-height:1.05;
  display:grid;place-items:center;text-align:center;box-shadow:inset 0 0 0 3px #b3261e,inset 0 0 0 5px #fff6e6,0 2px 4px rgba(0,0,0,.3);opacity:.92}
.scroll .sec h2{border-bottom:1px dashed rgba(120,80,30,.45);padding-bottom:6px;color:#3b2410}
.scroll h1{font-family:var(--serif);font-size:clamp(22px,4.4vw,30px);line-height:1.45;margin:0 0 12px}
.banner{background:#f6d6d6;color:var(--ruby);border-radius:8px;padding:8px 12px;font-size:13.5px;margin-bottom:12px}
.meta{display:grid;gap:4px;font-size:14px;background:#efe0bd;border-radius:8px;padding:10px 12px}
.meta b{color:var(--sub);font-weight:500;margin-right:6px}
.sec{margin-top:24px}
.sec h2{font-family:var(--serif);font-size:20px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.sec h2 .ic{font-size:20px}
.story{font-family:var(--serif);font-size:17.5px;line-height:2.05;color:#2e1f0c}
.sec h3{font-size:15px;color:#8a5a1a;margin:14px 0 4px}
.sec ul{padding-left:20px;margin:6px 0}
.quote{font-family:var(--serif);font-size:19px;font-weight:700;background:#2a2440;color:var(--gold2);border-radius:10px;padding:16px 18px;margin-top:8px;line-height:1.7}

.duel{margin-top:22px;background:linear-gradient(180deg,#2a2440,#1d1a33);border:2px solid var(--gold);border-radius:14px;padding:18px}
.duel h2{font-family:var(--serif);color:var(--gold2);font-size:20px;margin:0 0 4px}
.duel .rule{font-size:13px;color:var(--sand2);margin-bottom:12px}
.duel .q{font-weight:700;font-size:16.5px;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;border:1px solid #5b4a2a;background:#14183a;color:var(--papyrus);border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:15.5px}
.opt:hover:not(:disabled){border-color:var(--gold2)}
.opt.right{background:#1f4a3a;border-color:#4fd09a}
.opt.wrong{background:#4a1f24;border-color:#e0484f}
.opt:disabled{cursor:default}
.expl{display:none;margin-top:10px;padding:12px 14px;border-radius:10px;font-size:15px}
.expl.show{display:block}
.expl.ok{background:#1f4a3a} .expl.ng{background:#4a1f24}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:28px;flex-wrap:wrap}

/* 戰利品彈窗 */
.loot{position:fixed;inset:0;background:rgba(5,6,20,.75);display:none;place-items:center;z-index:20;padding:16px}
.loot.show{display:grid}
.loot .box{max-width:360px;width:100%;text-align:center;background:linear-gradient(180deg,#2a2440,#141030);border:2px solid var(--gold);border-radius:18px;padding:24px 20px;animation:pop .4s}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.loot .big{font-size:64px}
.loot h3{font-family:var(--serif);color:var(--gold2);font-size:22px;margin:6px 0}
.loot p{color:var(--sand);font-size:14.5px;margin:4px 0 14px}

/* 神燈動畫 */
.genie{position:fixed;inset:0;background:rgba(5,6,20,.82);display:none;place-items:center;z-index:20;padding:16px}
.genie.show{display:grid}
.genie .box{max-width:380px;width:100%;text-align:center;background:radial-gradient(ellipse at 50% 30%,#4a3a9a,#1a1440 70%);border:2px solid var(--gold);border-radius:18px;padding:18px 20px 22px;overflow:hidden}
.stage{position:relative;height:210px}
.lampi{position:absolute;left:50%;bottom:6px;font-size:64px;transform:translateX(-50%);filter:drop-shadow(0 0 12px rgba(255,217,130,.6))}
.genie.show .lampi{animation:rub .9s ease-in-out}
@keyframes rub{0%,100%{transform:translateX(-50%) rotate(0)}15%{transform:translateX(-56%) rotate(-16deg)}35%{transform:translateX(-44%) rotate(14deg)}55%{transform:translateX(-55%) rotate(-10deg)}75%{transform:translateX(-46%) rotate(8deg)}}
.spark{position:absolute;left:50%;bottom:50px;font-size:18px;opacity:0}
.genie.show .spark{animation:spark 1s ease-out .55s forwards}
.spark.s2{animation-delay:.65s!important}.spark.s3{animation-delay:.75s!important}.spark.s4{animation-delay:.85s!important}
@keyframes spark{0%{opacity:0;transform:translate(-50%,0) scale(.4)}30%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x)),var(--y)) scale(1.2)}}
.smoke{position:absolute;left:50%;bottom:44px;width:46px;height:46px;border-radius:50%;margin-left:-23px;opacity:0;
  background:radial-gradient(circle,rgba(170,150,255,.9),rgba(110,90,220,0) 70%);filter:blur(2px)}
.genie.show .smoke{animation:smoke 1.6s ease-out .7s forwards}
.smoke.k2{animation-delay:.85s!important;margin-left:-10px}.smoke.k3{animation-delay:1s!important;margin-left:-36px}
@keyframes smoke{0%{opacity:0;transform:translateY(0) scale(.4)}25%{opacity:.95}100%{opacity:0;transform:translateY(-150px) scale(2.6)}}
.djinn{position:absolute;left:50%;bottom:60px;font-size:84px;line-height:1;opacity:0;transform:translateX(-50%) scale(.1);
  filter:drop-shadow(0 0 18px rgba(170,150,255,.9))}
.genie.show .djinn{animation:rise .8s cubic-bezier(.2,1.4,.4,1) 1.15s forwards, float 2.4s ease-in-out 2s infinite}
@keyframes rise{to{opacity:1;transform:translateX(-50%) translateY(-34px) scale(1)}}
@keyframes float{0%,100%{opacity:1;transform:translateX(-50%) translateY(-34px) scale(1)}50%{opacity:1;transform:translateX(-50%) translateY(-44px) scale(1)}}
.reveal{opacity:0}
.genie.show .reveal{animation:fadeup .5s ease-out 1.8s forwards}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.genie .say{font-family:var(--serif);color:var(--gold2);font-size:18px;margin:4px 0 6px}
.genie .pick{color:var(--papyrus);font-size:15px;margin-bottom:14px;background:rgba(0,0,0,.25);border-radius:10px;padding:10px}
.hero-lamp{position:absolute;top:96px;left:7%;font-size:40px;background:none;border:0;filter:drop-shadow(0 0 10px rgba(255,217,130,.7));animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{transform:translateY(0) rotate(-6deg);filter:drop-shadow(0 0 6px rgba(255,217,130,.5))}50%{transform:translateY(-8px) rotate(4deg);filter:drop-shadow(0 0 18px rgba(255,217,130,.95))}}
@media(max-width:520px){.hero-lamp{top:70px;left:4%;font-size:30px}}
/* 講師介紹 */
.mentor{margin:0 0 24px;background:linear-gradient(135deg,#2a2440,#1d1a33);border:1px solid #5b4a2a;border-radius:16px;padding:18px;display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
.mentor img{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);box-shadow:0 0 0 6px rgba(232,182,76,.15)}
.mentor .k2{font-size:12.5px;letter-spacing:.2em;color:var(--sand2)}
.mentor h3{font-family:var(--serif);font-size:24px;color:var(--gold2);margin:2px 0}
.mentor .ttl{font-size:14.5px;color:var(--sand);margin-bottom:6px}
.mentor ul{margin:6px 0 0;padding-left:18px;font-size:14px;color:var(--papyrus)}
.mentor .todo{display:inline-block;margin-top:8px;font-size:12px;color:#ffb3b3;border:1px dashed #a5524a;border-radius:6px;padding:2px 8px}

  basis:["民法第 860 條：抵押權人得就抵押物賣得價金優先受償。","民法第 1010 條：夫妻之一方有管理財產顯有不當等情形，法院得因他方之請求，宣告改用分別財產制。","民法第 1030 條之3：為減少他方分配而處分婚後財產者，應追加計算。"],
  advice:["自住房屋可以考慮夫妻共同登記，重大處分需要雙方同意。","向地政事務所申請「地籍異動即時通」，房子一有設定抵押就會收到通知。","發現異常，儘速聲請分別財產制並保全證據。"],
  quote:"房子設定抵押不必問你，所以你要先讓自己收得到通知。",
  quiz:{q:"先生瞞著太太用自己名下的房子設定抵押，太太可以要求撤銷抵押權嗎？",options:[{t:"原則上不行，但可主張分別財產制與剩餘財產追加計算",ok:true},{t:"可以，配偶不同意就無效",ok:false},{t:"可以直接拒絕拍賣",ok:false}],expl:"抵押權對善意第三人有效；太太可依民法第 1010 條、第 1030 條之3 保障自己的權益。"} },
{ id:"S3-009", kind:"諮詢", src:"10/2 房地產篇・客戶諮詢 9（祭祀公業）",
  title:"家族祭祀公業的土地賣了數億元：家族會議說「只有男丁能分」，嫁出去的女兒一毛都沒有",
  cat:"家族企業與血淚警示", risk:4,
  laws:"祭祀公業條例；憲法法庭判決",
  story:["家族的祭祀公業有一大塊土地，處分後得到數億元補償金。","家族會議依照老規矩：派下員只限男丁，補償金全部發給兒子們，嫁出去的女兒被排除在外。"],
  blind:"憲法法庭已經宣告，以男系子孫限制派下員資格的規定違憲。女性子孫同樣可以享有派下員資格與財產分配權。",
  basis:["祭祀公業條例：規範派下員資格與祭祀公業財產處理。","憲法法庭判決：限制派下員以男丁為限之規定違憲，女性子孫享有平等權利（講義）。"],
  advice:["女兒可以提起訴訟，確認派下權存在，並請求分配收益（講義）。","家族處分祭祀公業財產前，先依最新法令確認派下員名冊。"],
  quote:"老規矩擋不住新憲法，女兒也是祖先的子孫。",
  quiz:{q:"祭祀公業土地處分後，女性子孫可以主張派下權與分配嗎？",options:[{t:"可以，限制男丁的規定已被宣告違憲",ok:true},{t:"不行，派下員只限男丁",ok:false},{t:"只有未出嫁的女兒可以",ok:false}],expl:"憲法法庭已宣告男丁限制違憲，女性子孫可確認派下權並請求分配。"} },
{ id:"S3-010", kind:"諮詢", src:"10/2 房地產篇・客戶諮詢 10（預留稅源）",
  title:"繼承3億元精華區建地，存款卻只有50萬：收到6000萬遺產稅單，土地面臨賤價拍賣",
  cat:"國稅局與稅務雷區", risk:5,
  laws:"遺產及贈與稅法第 30 條",
  story:["爸爸留下一塊精華區建地，市值約三億元，但名下存款只有五十萬元。","遺產稅單一寄來，是六千萬元。子女們拿不出現金，眼看土地就要被賤價拍賣。"],
  blind:"不動產多、現金少，是最常見的「繳不起遺產稅」困境。若沒有預留稅源，繼承人可能被迫賤賣資產或借高利貸。法律其實有實物抵繳的選項。",
  basis:["遺產及贈與稅法第 30 條：遺產稅應納稅額在一定金額以上，現金繳納確有困難者，得申請分期繳納；以現金繳納有困難時，得申請以遺產中之課徵標的物或易於變價及保管之實物一次抵繳。"],
  advice:["向國稅局申請以遺產中的土地或房屋「實物抵繳」遺產稅（講義）。","也可以評估分期繳納。","最根本的方法：生前以壽險指定受益人，預留繳稅的現金。"],
  quote:"先預留稅源，再談資產傳承。",
  quiz:{q:"繼承大量不動產卻沒有現金繳遺產稅，可以怎麼做？",options:[{t:"申請分期繳納，或以遺產中的不動產實物抵繳",ok:true},{t:"只能被強制拍賣",ok:false},{t:"拋棄繼承後再要回來",ok:false}],expl:"遺贈稅法第 30 條提供分期繳納與實物抵繳的方式。"} },
{ id:"S3-011", kind:"諮詢", src:"10/2 房地產篇・客戶諮詢 11（二親等買賣）",
  title:"爸爸用「假買賣」把房子過戶給長子節稅：爸爸過世後，弟妹檢舉長子逃漏稅",
  cat:"國稅局與稅務雷區", risk:5,
  laws:"遺產及贈與稅法第 5 條第 6 款；刑法第 214 條",
  story:["爸爸聽人說「用買賣比贈與省稅」，就和長子簽了買賣契約，把房子過戶給他，實際上一毛錢都沒付。","爸爸過世後，弟妹覺得不公平，向國稅局檢舉長子逃漏稅，還提告使公務員登載不實。"],
  blind:"二親等以內的買賣以贈與論；沒有實際金流的假買賣，會被認定為實質贈與，除了補稅加罰，還可能觸犯使公務員登載不實罪。",
  basis:["遺產及贈與稅法第 5 條第 6 款：二親等以內親屬間財產之買賣，以贈與論，但能提出支付價款之確實證明者除外。","刑法第 214 條：明知為不實之事項，而使公務員登載於職務上所掌之公文書，足以生損害於公眾或他人者，處三年以下有期徒刑等。"],
  advice:["善用每年 244 萬的贈與免稅額，分年或分持分過戶（講義）。","任何「省稅妙招」，都要先找第二位專家確認。"],
  quote:"假買賣省下的稅，可能換來一場官司。",
  quiz:{q:"父親和兒子簽買賣契約過戶房子，但實際沒有付款，稅法上怎麼看？",options:[{t:"以贈與論，還可能涉及刑責",ok:true},{t:"有買賣契約就不算贈與",ok:false},{t:"家人之間的交易國稅局不管",ok:false}],expl:"遺贈稅法第 5 條第 6 款：二親等買賣以贈與論；假買賣登記可能觸犯刑法第 214 條。"} },
{ id:"S3-012", kind:"諮詢", src:"10/2 房地產篇・客戶諮詢 12（拋棄繼承）",
  title:"兄弟為了讓媽媽一個人繼承，全部拋棄繼承：結果伯父、姑姑也一起來分",
  cat:"親情與防不孝條款", risk:4,
  laws:"民法第 1138 條、第 1144 條、第 1174 條、第 1176 條",
  story:["爸爸過世後，兄弟們想讓媽媽一個人繼承全部遺產，好讓她晚年安心，於是全部到法院辦了拋棄繼承。","沒想到繼承權並沒有全部歸媽媽，而是往下推移：媽媽要和爸爸的兄弟姊妹，也就是伯父、姑姑，一起繼承。"],
  blind:"子女全部拋棄後，若沒有孫子女，繼承權會依序推移到被繼承人的父母、兄弟姊妹；配偶與兄弟姊妹共同繼承時，配偶只分一半。拋棄繼承一旦完成，就不能撤回。",
  basis:["民法第 1138 條：繼承順序為直系血親卑親屬、父母、兄弟姊妹、祖父母。","民法第 1144 條第 2 款：配偶與兄弟姊妹共同繼承時，配偶的應繼分為遺產二分之一。","民法第 1176 條：第一順序繼承人全部拋棄時，依序由次順序繼承人繼承。"],
  advice:["想讓特定人取得遺產，應該全體繼承人共同簽訂「遺產分割協議書」，而不是拋棄繼承（講義）。","拋棄繼承前，一定要先畫出繼承系統表，確認下一順位是誰。"],
  quote:"拋棄繼承不是讓給媽媽，而是讓給下一個順位。",
  quiz:{q:"子女想讓母親一人取得父親的遺產，正確做法是什麼？",options:[{t:"全體繼承人簽訂遺產分割協議書",ok:true},{t:"子女全部拋棄繼承",ok:false},{t:"由母親單獨向法院申請",ok:false}],expl:"拋棄繼承會使繼承權推移到次順位（民法第 1176 條）；遺產分割協議才能讓特定人取得遺產。"} },
{ id:"S3-013", kind:"諮詢", src:"10/2 房地產篇・客戶諮詢 13（拋棄繼承期間責任）",
  title:"子女拋棄繼承了老厝和債務：颱風把老厝吹垮、壓壞鄰居的房子和車，還要負責嗎？",
  cat:"親情與防不孝條款", risk:4,
  laws:"民法第 1176 條之1、第 1177 條、第 1178 條",
  story:["爸爸留下一間老厝和一些債務，子女們全部拋棄繼承，覺得從此與自己無關。","一場颱風把老厝吹垮，壓壞了鄰居的房子和車子。鄰居找上門求償，子女們說：「我們已經拋棄繼承了，不是繼承人，概不負責。」"],
  blind:"拋棄繼承的人，在下一順位繼承人或遺產管理人開始管理之前，仍要繼續管理遺產，盡到和處理自己事務相同的注意。沒有交接出去，責任就還沒結束。",
  basis:["民法第 1176 條之1：拋棄繼承權者，就其所管理之遺產，於其他繼承人或遺產管理人開始管理前，應與處理自己事務為同一之注意，繼續管理之。","民法第 1177 條、第 1178 條：繼承人有無不明時，得聲請法院選任遺產管理人。"],
  advice:["拋棄繼承後，若沒有其他繼承人接手，要儘速向法院聲請選任遺產管理人（例如律師、地政士），切斷管理責任（講義）。","在交接前，做好老屋的基本安全維護。"],
  quote:"拋棄的是權利，不是馬上卸下的責任。",
  quiz:{q:"拋棄繼承後，在遺產管理人接手前，拋棄者對遺產有什麼責任？",options:[{t:"仍應以處理自己事務的注意繼續管理",ok:true},{t:"完全不用負任何責任",ok:false},{t:"要負擔全部債務",ok:false}],expl:"民法第 1176 條之1：拋棄者在他人開始管理前，仍應繼續管理遺產。"} },
{ id:"S3-014", kind:"諮詢", src:"10/2 房地產篇・客戶諮詢 14（房地合一稅）",
  title:"爸爸過世，孩子們想先讓媽媽繼承老宅、等媽媽走了再傳給自己：連續繼承讓稅多了681萬",
  cat:"國稅局與稅務雷區", risk:4,
  laws:"所得稅法第 4 條之4、第 14 條之4、第 14 條之5；財政部函令",
  story:["爸爸過世後，孩子們商量：老宅先讓媽媽一個人繼承，等媽媽百年之後，再由孩子們繼承。聽起來很孝順，也很合理。","但講師試算後發現，這樣「繞一手」的安排，未來出售時的稅負，比直接由孩子繼承多出約六百八十一萬元。"],
  blind:"依財政部新函令，連續繼承轉手，可能讓房地合一稅的取得時點與成本認定改變，未來出售時稅負大增（講義試算多出約 681 萬元）。繼承的安排不只要考慮情感，也要算清楚未來的稅。",
  basis:["所得稅法第 4 條之4、第 14 條之4：個人出售房地，適用房地合一所得稅規定。","所得稅法第 14 條之5：繼承取得之房地，以繼承時之公告現值等為取得成本。","財政部函令：連續繼承情形之稅務認定（詳見講義，細節待講義核對）。"],
  advice:["遺產分割前，先試算不同分配方式在「未來出售」時的稅負。","母親的生活照顧，可以改用信託、保險或居住安排來處理，不一定要讓房子先過到母親名下。"],
  quote:"繞一手的孝心，可能多繳幾百萬的稅。",
  quiz:{q:"遺產分割時讓房子「先給媽媽、以後再給孩子」，可能有什麼風險？",options:[{t:"連續繼承可能使未來出售時的房地合一稅大增",ok:true},{t:"完全沒有稅務影響",ok:false},{t:"一定比較省稅",ok:false}],expl:"依講師說明與財政部函令，連續繼承可能改變取得成本與時點，稅負增加。"} },
{ id:"S3-015", kind:"諮詢", src:"10/2 房地產篇・客戶諮詢 15（信託）",
  title:"阿公把數億元土地交付信託，約定結束後歸孫子：阿公過世後，叔叔們要求併入遺產",
  cat:"家族企業與血淚警示", risk:4,
  laws:"信託法第 1 條、第 8 條；遺產及贈與稅法第 3 條之2",
  story:["阿公把名下數億元的土地交付信託，約定信託結束後，土地歸孫子所有。","阿公過世後，叔叔們不服，主張這些土地應該併入遺產，計算特留分和歸扣。"],
  blind:"信託財產獨立於委託人的遺產之外，繼承人無法直接主張分割信託的土地；若被認定為規避特留分的脫法行為，繼承人能主張的也只是「信託受益權」，而不是土地本身。",
  basis:["信託法第 1 條：委託人將財產權移轉，使受託人依信託本旨管理或處分。","信託法第 8 條：信託關係不因委託人死亡而消滅。","遺產及贈與稅法第 3 條之2：信託受益權依規定計入遺產或贈與課稅。"],
  advice:["大額不動產傳承可善用信託，保留管理權並指定最終歸屬。","設計時要兼顧其他繼承人的特留分，降低日後爭訟。","信託的稅務（贈與稅、遺產稅）要事前試算。"],
  quote:"信託守住的不只是財產，還有長輩的心願。",
  quiz:{q:"委託人過世後，交付信託的土地能否直接被繼承人分割？",options:[{t:"不能，信託財產獨立，最多只能就信託受益權主張",ok:true},{t:"可以，委託人過世信託就自動結束",ok:false},{t:"可以，只要繼承人全體同意",ok:false}],expl:"信託法第 8 條：信託關係不因委託人死亡而消滅；繼承人僅能就受益權主張。"} },
{ id:"S3-016", kind:"諮詢", src:"10/2 房地產篇・客戶諮詢 16（地上權設定）",
  title:"父母把透天厝送給獨子，同時設定終身地上權：兒子欠債房子被法拍，新買家要他們搬走",
  cat:"親情與防不孝條款", risk:4,
  laws:"民法第 757 條、第 832 條；強制執行法",
  story:["父母把透天厝贈與給獨生子，同時辦理設定終身無償的用益物權，保障自己可以住到老。","後來兒子欠債，房子被法拍。新買家拿到房子後，要求兩老搬離。"],
  blind:"講師指出：父母事先設定的用益物權已經登記，具有物權效力，拍賣條件為「不點交」，新買家必須承擔這個負擔，無權要求兩老搬離。這和只簽一紙居住約定的效果完全不同。（台灣民法採物權法定主義，並沒有獨立的「居住權」物權；實務上多以地上權等用益物權設計，具體方式請由地政士與律師確認。）",
  basis:["民法第 757 條：物權除依法律或習慣外，不得創設（物權法定主義）。","民法第 832 條：地上權，謂以在他人土地之上下有建築物或其他工作物為目的而使用其土地之權。","強制執行法：拍賣標的有第三人之用益物權時，買受人應承受該負擔（不點交）。"],
  advice:["把房子贈與子女前，先設定並登記用益物權，保障自己的居住（講義）。","請地政士、律師依實際情況設計物權種類與期限。"],
  quote:"登記過的權利，連法拍的新屋主都要尊重。",
  quiz:{q:"父母贈與房子給子女前，怎麼做最能保障自己日後的居住，即使房子被法拍？",options:[{t:"事先設定並登記用益物權",ok:true},{t:"口頭約定子女讓他們住",ok:false},{t:"寫一張私人切結書",ok:false}],expl:"經登記的用益物權具物權效力，可對抗後來的買受人；單純約定只拘束當事人。"} },
{ id:"S3-017", kind:"諮詢", src:"10/2 房地產篇・客戶諮詢 17（失智）",
  title:"長子全職照顧中風的爸爸，臨終前一年把房子過戶給他：二弟提告偽造文書，說爸爸當時已失智",
  cat:"親情與防不孝條款", risk:5,
  laws:"民法第 15 條、第 75 條；刑法第 210 條",
  story:["爸爸中風後，長子辭掉工作全職照顧。爸爸臨終前一年，把房子過戶給了長子。","爸爸過世後，二弟提告偽造文書，指控爸爸當時已經失智，根本沒有能力決定過戶。"],
  blind:"法院會調閱醫療病歷，例如重度失智、CDR 評估表，也會傳喚經手的地政士。如果證明爸爸當時沒有意思能力，過戶可能無效，照顧者也可能惹上官司。",
  basis:["民法第 75 條：無行為能力人之意思表示無效；雖非無行為能力人，而其意思表示係在無意識或精神錯亂中所為者亦同。","刑法第 210 條：偽造私文書罪。"],
  advice:["照顧者接受長輩生前贈與時，過戶前先到醫院開立「意思能力診斷證明書」（講義）。","或辦理公證，讓公證人確認長輩的真意。","全程保留照顧紀錄與溝通紀錄。"],
  quote:"照顧再多年，也要一張醫生的證明，才能守住長輩的心意。",
  quiz:{q:"長輩年紀大或生病時要把房子過戶給照顧者，怎麼做能降低日後被質疑？",options:[{t:"過戶前取得意思能力診斷證明，或辦理公證",ok:true},{t:"只要長輩簽名就好",ok:false},{t:"由照顧者代簽即可",ok:false}],expl:"意思能力是有效法律行為的前提（民法第 75 條）；診斷證明與公證可作為證據。"} },
{ id:"S3-018", kind:"諮詢", src:"10/2 房地產篇・客戶諮詢 18（口授遺囑）",
  title:"爸爸在加護病房口述「房子給女兒」，女兒用手機錄了下來：弟妹說這段錄音不算數",
  cat:"親情與防不孝條款", risk:4,
  laws:"民法第 1195 條、第 1196 條、第 1197 條",
  story:["爸爸在加護病房臨終前，口述要把房子留給女兒，女兒趕緊用手機錄了下來。","爸爸過世後，弟妹拒絕配合過戶，主張這段錄音不是有效的遺囑。"],
  blind:"口授遺囑必須符合「生命危急或其他特殊情形」等法定要件，並有兩位以上見證人，依法定方式作成。單純用手機錄音，不符合法定程序，遺囑無效，房子仍由全體繼承人依應繼分繼承。",
  basis:["民法第 1195 條：遺囑人因生命危急或其他特殊情形，不能依其他方式為遺囑者，得指定二人以上之見證人，以口授遺囑為之（含筆記或錄音之法定方式）。","民法第 1196 條：口授遺囑應於遺囑人死亡後三個月內，提經親屬會議認定其真偽。","民法第 1197 條：口授遺囑，自遺囑人能依其他方式為遺囑之時起，經過三個月而失其效力。"],
  advice:["趁長輩健康時，就預先立好公證遺囑或自書遺囑。","萬一情況危急，口授遺囑要有兩位以上見證人，並依法定方式錄音或筆記。"],
  quote:"一段手機錄音，敵不過法律要求的兩位見證人。",
  quiz:{q:"臨終前用手機錄下長輩口述的分配意思，是有效的遺囑嗎？",options:[{t:"不一定，口授遺囑須有兩位以上見證人並依法定方式作成",ok:true},{t:"有錄音就一定有效",ok:false},{t:"只要家人都聽到就有效",ok:false}],expl:"民法第 1195 條：口授遺囑須符合生命危急等要件，並有二人以上見證人。"} },
{ id:"S3-019", kind:"諮詢", src:"10/2 房地產篇・客戶諮詢 19（代筆遺囑）",
  title:"重病的爸爸請律師做代筆遺囑，全程只點頭說「嗯」：法院判決遺囑無效",
  cat:"親情與防不孝條款", risk:4,
  laws:"民法第 73 條、第 1194 條",
  story:["爸爸重病時，請律師來家裡作成代筆遺囑。過程中，都是律師唸出內容，爸爸只是點頭、說「嗯」。","爸爸過世後，其他兄弟提告，主張遺囑無效。"],
  blind:"代筆遺囑要由遺囑人「口述」遺囑意旨。最高法院指出，口述必須由立遺囑人親自用言語陳述，不能只用點頭回應代替。本案遺囑無效，房子回到按應繼分平均分配。",
  basis:["民法第 1194 條：代筆遺囑，由遺囑人指定三人以上之見證人，由遺囑人口述遺囑意旨，使見證人中之一人筆記、宣讀、講解，經遺囑人認可後，記明年月日及代筆人之姓名，由見證人全體及遺囑人同行簽名。","民法第 73 條：法律行為不依法定方式者，無效。","最高法院見解：口述須由遺囑人以言語親自陳述（講義）。"],
  advice:["趁意識清楚、能夠說話時立遺囑，不要拖到病危。","代筆遺囑要讓遺囑人親口陳述內容，並全程錄影存證。","財產較多時，優先考慮公證遺囑。"],
  quote:"遺囑要自己說出口，點頭不算數。",
  quiz:{q:"代筆遺囑過程中，遺囑人只點頭回應，遺囑有效嗎？",options:[{t:"無效，口述須由遺囑人親自以言語陳述",ok:true},{t:"有效，點頭就代表同意",ok:false},{t:"只要有三位見證人就有效",ok:false}],expl:"民法第 1194 條要求遺囑人口述；最高法院認為點頭不能代替口述。"} },
{ id:"S3-020", kind:"諮詢", src:"10/2 房地產篇・客戶諮詢 20（遺囑禁止分割）",
  title:"爸爸遺囑寫明30年內不准賣、不准分割祖厝農地：三弟經商失敗急需現金，告上法院要求分割",
  cat:"親情與防不孝條款", risk:3,
  laws:"民法第 1164 條、第 1165 條",
  story:["爸爸希望祖產永遠留在家族，在遺囑中寫明：三十年內不准賣掉、也不准分割祖厝和農地。","後來三弟經商失敗，急需現金，向法院提告，請求分割遺產。"],
  blind:"遺囑可以禁止遺產分割，但效力最長只有十年；超過十年的部分，自動縮短為十年。期限一到，繼承人就可以請求分割。",
  basis:["民法第 1165 條第 2 項：遺囑禁止遺產之分割者，其禁止之效力以十年為限。","民法第 1164 條：繼承人得隨時請求分割遺產，但法律另有規定或契約另有訂定者，不在此限。"],
  advice:["想讓祖產長期保留，可以考慮信託或成立家族公司，而不是只靠遺囑禁止分割。","同時照顧到可能需要現金的子女，例如以保險金補償。"],
  quote:"遺囑能留住祖產十年，留不住三十年。",
  quiz:{q:"遺囑禁止遺產分割，最長效力是多久？",options:[{t:"十年",ok:true},{t:"三十年",ok:false},{t:"永久有效",ok:false}],expl:"民法第 1165 條第 2 項：遺囑禁止分割之效力以十年為限。"} },
{ id:"S3-021", kind:"諮詢", src:"10/2 房地產篇・客戶諮詢 21（宗教團體借名）",
  title:"宗教前人生前名下的土地，其實是道場的：繼承人說是借名登記，國稅局仍開出近3000萬遺產稅",
  cat:"借名登記與產權迷思", risk:4,
  laws:"民法第 759 條之1；宗教團體以自然人名義登記不動產處理暫行條例",
  story:["一位宗教團體的前人，生前名下登記了多筆土地，實際上是道場所有，只是借用他的名義登記。他立了遺囑，把這些土地遺贈出去。","他過世後，繼承人主張這些土地是借名登記，不屬於遺產；國稅局卻依登記名義認定為遺產，開出將近三千萬元的遺產稅單。"],
  blind:"不動產登記在誰名下，國稅局就先推定是誰的。主張借名登記，必須拿出買進土地的資金來源、資金流程與契約等憑證；否則就會被當成遺產課稅。",
  basis:["民法第 759 條之1：不動產經登記者，推定登記權利人適法有此權利。","宗教團體以自然人名義登記不動產處理暫行條例：宗教團體可依程序，將以自然人名義登記的不動產更名回宗教團體。"],
  advice:["提出購地資金來源、資金流程與契約等憑證，證明借名（講義）。","更好的做法，是在生前就依暫行條例，把不動產移轉回宗教團體名下（講義）。"],
  quote:"借名的土地，登記人一走，稅單就跟著來。",
  quiz:{q:"以個人名義登記的宗教團體土地，要避免被當成個人遺產，最好怎麼做？",options:[{t:"生前依暫行條例更名回宗教團體",ok:true},{t:"等登記人過世後再說明",ok:false},{t:"口頭告知國稅局即可",ok:false}],expl:"依宗教團體以自然人名義登記不動產處理暫行條例，可在生前移轉回宗教團體。"} },
{ id:"S3-022", kind:"諮詢", src:"10/2 房地產篇・客戶諮詢 22（外國遺囑）",
  title:"移民美國的爸爸在美國立遺囑，把台灣的店面留給長子：次子說美國遺囑沒經台灣公證無效，自己去辦了繼承登記",
  cat:"借名登記與產權迷思", risk:4,
  laws:"涉外民事法律適用法第 60 條、第 61 條；外國文書驗證規定",
  story:["爸爸移民美國多年，在美國立下遺囑，把台北精華區的店面留給長子。","爸爸過世後，次子主張：「美國的遺囑沒有經過台灣法院公證，不算數。」他自己去辦了繼承登記，還占用店面收租。"],
  blind:"外國遺囑並不是一律無效。依涉外民事法律適用法，遺囑的方式只要符合遺囑人當時的本國法、遺囑作成地法或不動產所在地法之一，就是有效的。不過，要在台灣辦理登記，外國文書通常須經我國駐外館處驗證並附中文譯本。（講義本案解答頁未收錄，以上為補充說明，建議講義核對。）",
  basis:["涉外民事法律適用法第 60 條：遺囑之成立及效力，依成立時遺囑人之本國法。","涉外民事法律適用法第 61 條：遺囑之方式，符合遺囑人遺囑時或死亡時之本國法、遺囑作成地法，或不動產所在地法者，均為有效。","外國作成的文書在台使用，通常須經駐外館處驗證。"],
  advice:["跨國家庭立遺囑時，台灣的不動產可以另立一份符合台灣法律的遺囑。","外國遺囑要事先辦妥驗證與翻譯，並指定遺囑執行人。","長子可以依遺囑主張權利，並請求次子返還收取的租金。"],
  quote:"遺囑寫在哪裡不是重點，能不能在財產所在地執行才是重點。",
  quiz:{q:"在美國依當地法律作成的遺囑，處分台灣的不動產，有效嗎？",options:[{t:"方式符合作成地法等即可有效，但在台使用通常須驗證",ok:true},{t:"一律無效，必須重新在台灣立遺囑",ok:false},{t:"只要翻譯成中文就一定可以直接登記",ok:false}],expl:"涉外民事法律適用法第 61 條：遺囑方式符合作成地法等即有效；在台使用另須驗證。"} },
{
  id:"S3-023", kind:"諮詢", src:"10/2 房地產篇・課程錄音（海外房產）",
  title:"「台灣去哪裡找兩百多萬的房子？」買下美國小屋留給孩子：父親過世後，上班族兒子一再請假赴美出庭",
  cat:"國稅局與稅務雷區", risk:4,
  laws:"遺產及贈與稅法第 1 條、第 11 條；所得基本稅額條例；美國遺產稅與遺囑認證（Probate）程序",
  story:[
    "林伯伯退休後參加一場海外房產說明會，業務員說得天花亂墜：「台灣去哪裡找兩百多萬的房子？買來出租收租金，以後還能留給孩子。」他心動之下，在美國買了一間小屋。",
    "買了才發現，房子不一定租得出去，當地的稅也搞不清楚。幾年後林伯伯過世，在美國國稅局眼中，他是一個「外國人」；房子要依當地規定處理遺產稅，還得走當地法院的遺產認證程序。兒子是上班族，哪來那麼多假，一次又一次請假飛到美國出庭？"
  ],
  blind:"海外房產的風險不只在買的那一刻。持有期間有出租與當地稅務問題；賣掉時，售房收入在台灣屬於海外所得，要依規定申報，不要以為政府查不到。最麻煩的是過世以後：不同國家有不同的遺產規定，外國人在美國的遺產稅免稅額很低，房產還可能要經過當地法院的遺產認證，費時又費錢，負擔全部落在孩子身上。",
  basis:[
    "遺產及贈與稅法第 1 條：經常居住中華民國境內之中華民國國民死亡時遺有之財產，無論在境內境外，均應課徵遺產稅。",
    "遺產及贈與稅法第 11 條第 1 項：國外財產依所在地國法律已納之遺產稅，得由納稅義務人提出證明，自應納遺產稅額中扣抵（以不超過該財產依我國稅率計算之稅額為限）。",
    "所得基本稅額條例：個人的海外所得達一定金額，應計入基本所得額申報。",
    "美國規定（補充）：非美國居民的外國人，美國境內財產的遺產稅免稅額遠低於美國居民（現行約 6 萬美元，以美國國稅局最新規定為準）；不動產通常須經所在州法院的遺囑認證程序。"
  ],
  advice:[
    "購買海外房產前，先問清楚：租給誰、當地持有稅與所得稅、出售時的申報義務、過世時的遺產稅與繼承程序。",
    "不要只聽業者話術，請當地與台灣的稅務、法律專業人士一起評估。",
    "已經持有的人，可以評估在當地以信託等方式持有，減少日後子女跑法院的負擔，並在台灣遺囑中一併安排。"
  ],
  quote:"便宜的是房子，昂貴的是留給孩子的程序。",
  quiz:{
    q:"台灣居民在美國持有房產，過世後可能面臨什麼問題？",
    options:[
      {t:"可能要繳美國遺產稅、走當地法院認證程序，台灣也要申報遺產", ok:true},
      {t:"海外房產不在台灣，跟台灣遺產稅完全無關", ok:false},
      {t:"只要孩子是台灣人，就能直接過戶，不必任何程序", ok:false}
    ],
    expl:"遺贈稅法第 1 條：境內居住國民的境外財產也要課遺產稅（第 11 條可扣抵國外已納稅額）；美國端另有遺產稅與遺囑認證程序。"
  }
},
{
  id:"S3-024", kind:"新聞", src:"10/2 房地產篇・課程錄音（不孝子奪屋黑布條案）",
  title:"老父親在門口掛黑布條「不孝子奪我房屋」：房子繞了一圈轉到二兒子名下，兒子要把爸爸趕出去",
  cat:"親情與防不孝條款", risk:5,
  laws:"遺產及贈與稅法第 5 條第 6 款；稅捐稽徵法第 12 條之1；民法第 412 條、第 767 條",
  story:[
    "一位老父親在家門口掛起黑布條，寫著：「不孝子奪我房屋，將老夫驅離住所，世道淪喪。」看起來委屈極了。",
    "細查才發現，這間房子原本登記在媽媽名下，後來移轉到爸爸名下，接著轉到一位第三者名下，最後又轉到二兒子名下。二兒子認為房子是他的，要不要讓爸爸住由他決定，最後要把爸爸趕出去。老父親說不知道當初為什麼要這樣轉，講師卻懷疑：這很可能是為了避開「二親等之間買賣」的規定，才刻意繞道。"
  ],
  blind:"二親等以內親屬之間的買賣，原則上「以贈與論」；繞過第三人轉手，國稅局也可能依實質課稅原則認定，這是國稅局嚴格盯著的態樣。更大的問題是：房子最後登記在兒子名下，兒子就是所有權人，可以請父親搬走；當初若沒有寫下「讓父親終身居住」的約定，父親在法律上幾乎沒有立場。講師提醒：不管是誰教你的，做任何決定之前，一定要找另一位專家再確認一次；一旦做錯，稅務差距可能上千萬。",
  basis:[
    "遺產及贈與稅法第 5 條第 6 款：二親等以內親屬間財產之買賣，以贈與論；但能提出已支付價款之確實證明，且該價款非由出賣人貸與或提供擔保者，不在此限。",
    "稅捐稽徵法第 12 條之1：國稅局得依實質經濟事實認定課稅構成要件，繞道交易仍可能被認定為贈與。",
    "民法第 767 條：所有人對於無權占有其所有物者，得請求返還。",
    "民法第 412 條：若當初以附負擔（例如讓父母終身居住）方式贈與，受贈人不履行時，贈與人可撤銷贈與。"
  ],
  advice:[

function evCode(){ return String(S.pid||"").replace(/[^a-z0-9]/gi,"").slice(-8).toUpperCase(); }
function evRecalc(){
  const E = S.ev, P = EVENT.P;
  const sc = Object.values(E.won).reduce((a,b)=>a+b,0) + E.days.length*P.day + E.daily.length*P.daily +
    (E.check?P.check:0) + (E.unlock?P.unlock:0) + E.sweep.length*P.sweep;

function evOnWin(c, boss){
  if(!evOn() || S.ev.won[c.id]!=null) return null;
  const P = EVENT.P, miss = S.ev.miss[c.id]||0, lines = [];
  const base = boss ? P.boss : P.kill, hb = miss===0 ? P.clean : miss===1 ? P.oneMiss : 0;
  S.ev.won[c.id] = base + hb;
  lines.push(`打倒${boss?"BOSS":"怪物"} +${base}`); if(hb) lines.push(`${miss===0?"無傷擊敗":"只錯一次"} +${hb}`);
  const d = evDay(); if(d) lines.push(`今日闖關 +${d}`);
  if(c.id===dailyCase().id && !S.ev.daily.includes(today)){ S.ev.daily.push(today); lines.push(`今日石室 +${P.daily}`); }

  const before = S.ev.score, after = evRecalc(); save();
  return { add: after - before, total: after, lines };
}

const kwNorm = t => String(t||"").replace(/[\uFF01-\uFF5E]/g, ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0)).replace(/\u3000/g," ").toLowerCase();
const kwHay = new Map();

function kwAlts(t){

const mtBigrams = t => { const x = kwNorm(t).replace(/[^一-鿿a-z0-9]/g,""); const b = new Set(); for(let i=0;i<x.length-1;i++) b.add(x.slice(i,i+2)); return b; };
const mtCaseBg = new Map(), mtDf = new Map();
/* 越少案例提到的主題，比對到時加分越多（例：「再婚」比「房子」更有鑑別度） */
function mtIdf(h){
  if(!mtDf.has(h.k)) mtDf.set(h.k, CASES.filter(c=>h.w.some(w=>kwText(c).includes(kwNorm(w)))).length);
  return 2 + 4 * (1 - mtDf.get(h.k) / CASES.length);
}
function mtMatch(txt){
  const t = kwNorm(txt);
  const hits = MT_CONCEPTS.filter(c=>c.w.some(w=>t.includes(kwNorm(w))));
  const ub = mtBigrams(txt);
  const res = CASES.map(c=>{
    const hay = kwText(c);
    if(!mtCaseBg.has(c.id)) mtCaseBg.set(c.id, mtBigrams(c.title + (c.story||[]).join("") + c.blind));
    const cb = mtCaseBg.get(c.id);
    let sc = 0; const why = [];
    hits.forEach(h=>{ if(h.w.some(w=>hay.includes(kwNorm(w)))){ sc += mtIdf(h); why.push(h.k); } if(h.cat && h.cat===c.cat) sc += 1; });
    let ov = 0; ub.forEach(g=>{ if(cb.has(g)) ov++; });
    sc += Math.min(4, ov / Math.max(6, ub.size) * 8);
    return {c, sc, why};
  }).filter(r=>r.sc >= 2).sort((a,b)=>b.sc-a.sc).slice(0,5);
  return {hits, res};
}

function endTour(){ document.getElementById("tour").classList.remove("show"); try{ localStorage.setItem("yun101_tour","1"); }catch(_){} }
function drawTour(){
  const x = tourList[ti]; if(!x){ endTour(); return; }
  const el = document.querySelector(x.sel), fixed = getComputedStyle(el).position==="fixed";
  const tall = el.getBoundingClientRect().height > innerHeight * 0.55;
  if(!fixed){ if(tall){ window.scrollTo(0, el.getBoundingClientRect().top + scrollY - 12); } else el.scrollIntoView({block:"center"}); }
  setTimeout(()=>{
    const r0 = el.getBoundingClientRect(), pad = 6;
    const r = {left:r0.left, top:r0.top, width:r0.width, height: tall ? Math.min(r0.height, innerHeight*0.5) : r0.height};
    r.bottom = r.top + r.height;
    const sp = document.getElementById("tspot"), tp = document.getElementById("ttip");
    Object.assign(sp.style,{left:(r.left-pad)+"px",top:(r.top-pad)+"px",width:(r.width+pad*2)+"px",height:(r.height+pad*2)+"px"});
    tp.innerHTML = `<div class="tn">網頁導覽 ${ti+1} / ${tourList.length}</div><h4>${x.t}</h4><div>${x.d}</div>
      <div class="tb"><button class="s" onclick="endTour()">略過</button>${ti?'<button class="s" onclick="ti--;drawTour()">← 上一步</button>':''}<button class="p" onclick="${ti===tourList.length-1?'endTour()':'ti++;drawTour()'}">${ti===tourList.length-1?'完成 ✅':'下一步 →'}</button></div>`;
    const h = tp.offsetHeight, vw = innerWidth, vh = innerHeight, w = tp.offsetWidth;
    let top = r.bottom + 14; if(top + h > vh - 10) top = Math.max(10, r.top - h - 14);
    if(top < 10 || (top + h > vh - 10)) top = vh - h - 16;
    tp.style.top = top + "px"; tp.style.left = Math.min(Math.max(16, r.left + r.width/2 - w/2), vw - w - 16) + "px";
  }, fixed ? 0 : 280);
}
window.addEventListener("resize", ()=>{ if(document.getElementById("tour").classList.contains("show")) drawTour(); });

/* ===== 📸 圖卡（戰績卡、證書）===== */
let LASTWIN = null;
function wrapText(ctx, text, x, y, maxW, lh, maxLines){
  let line = "", lines = [];
  for(const ch of text){ if(ctx.measureText(line+ch).width > maxW){ lines.push(line); line = ch; } else line += ch; }
  if(line) lines.push(line);
  if(maxLines && lines.length > maxLines){ lines = lines.slice(0, maxLines); lines[maxLines-1] = lines[maxLines-1].slice(0,-1) + "…"; }
  lines.forEach((l,i)=>ctx.fillText(l, x, y + i*lh));
  return y + lines.length*lh;
}
function baseCanvas(){
  const cv = document.createElement("canvas"); cv.width = 1080; cv.height = 1350;
  const x = cv.getContext("2d");
  const g = x.createLinearGradient(0,0,0,1350); g.addColorStop(0,"#2a2d6a"); g.addColorStop(.55,"#141838"); g.addColorStop(1,"#0f1433");
  x.fillStyle = g; x.fillRect(0,0,1080,1350);
  x.fillStyle = "rgba(255,255,255,.55)"; for(let i=0;i<70;i++){ x.fillRect((i*137)%1080, (i*251)%700, 2, 2); }
  x.strokeStyle = "#e8b64c"; x.lineWidth = 6; x.strokeRect(40,40,1000,1270);
  x.fillStyle = "#c9a76b"; x.beginPath(); x.moveTo(0,1350); x.quadraticCurveTo(300,1130,620,1200); x.quadraticCurveTo(860,1240,1080,1150); x.lineTo(1080,1350); x.fill();
  x.textAlign = "center"; x.fillStyle = "#ffd982"; x.font = "900 120px sans-serif"; x.fillText("101", 540, 200);
  x.font = "700 52px serif"; x.fillStyle = "#f6ead0"; x.fillText("夜傳承秘境", 540, 270);
  return [cv, x];
}
function download(cv, name){
  try{ const a = document.createElement("a"); a.href = cv.toDataURL("image/png"); a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast("圖卡已下載，可以傳到 LINE 或 FB 分享 📸"); }
  catch(e){ toast("此瀏覽器無法下載圖卡"); }
}

/* ===== 頁內輸入框（取代瀏覽器 prompt；預覽視窗、LINE 內建瀏覽器會擋 prompt） ===== */
function askBox(title, hint, val, mode){
  return new Promise(res=>{
    const m=document.getElementById("ask"), f=document.getElementById("askF");
    document.getElementById("askT").textContent=title; document.getElementById("askP").textContent=hint||"";
    f.innerHTML = mode==="copy" ? '<textarea readonly></textarea>' : '<input type="text" maxlength="40">';
    const el=f.firstChild; el.value=val||"";
    const ok=document.getElementById("askOk"), no=document.getElementById("askNo");
    ok.textContent = mode==="copy" ? "完成" : "確定"; no.style.display = mode==="copy" ? "none" : "";
    const end=v=>{ m.classList.remove("show"); ok.onclick=no.onclick=el.onkeydown=null; res(v); };
    ok.onclick=()=>end(mode==="copy"?true:el.value); no.onclick=()=>end(null);
    el.onkeydown=e=>{ if(e.key==="Enter" && mode!=="copy"){ e.preventDefault(); end(el.value); } if(e.key==="Escape") end(null); };
    m.classList.add("show"); setTimeout(()=>{ el.focus(); el.select(); },50);
  });
}
function askText(title, hint, val){ return askBox(title, hint, val, "text"); }
