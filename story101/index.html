  const SB=new Uint8Array(256);
  (function(){ let p=1,q=1; do{ p=p^((p<<1)&255)^(p&0x80?0x1b:0); q^=q<<1; q^=q<<2; q^=q<<4; q&=255; if(q&0x80) q^=0x09;

    const w=new Uint8Array(240); w.set(key); let rc=1;
    for(let i=32;i<240;i+=4){
      let t=[w[i-4],w[i-3],w[i-2],w[i-1]];
      if(i%32===0){ t=[SB[t[1]]^rc,SB[t[2]],SB[t[3]],SB[t[0]]]; rc=xt(rc); }
      else if(i%32===16){ t=t.map(x=>SB[x]); }
      for(let j=0;j<4;j++) w[i+j]=w[i-32+j]^t[j];
    }
    return w;
  }
  function encBlock(w, inp, out){
    const s=new Uint8Array(16); for(let i=0;i<16;i++) s[i]=inp[i]^w[i];
    const t=new Uint8Array(16);
    for(let r=1;r<=14;r++){

    }

const AK = "yun101_auth";
const d64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const e64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const HAS = !!(window.crypto && crypto.subtle && window.isSecureContext !== false);
async function deriveRaw(pw){
  if(!HAS){ await new Promise(r=>setTimeout(r,30)); return FB.pbkdf2(new TextEncoder().encode(pw), d64(P.s), P.n); }
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return crypto.subtle.deriveBits({name:"PBKDF2", salt:d64(P.s), iterations:P.n, hash:"SHA-256"}, base, 256);
}
async function decrypt(raw){
  if(!HAS){
    const html = new TextDecoder().decode(FB.gcmDecrypt(new Uint8Array(raw), d64(P.i), d64(P.c)));
    if(!html.startsWith("<!DOCTYPE html>")) throw new Error("bad");
    return html;
  }
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:d64(P.i)}, key, d64(P.c));
  return new TextDecoder().decode(pt);
}
function show(html){
  // 頁面還在載入時呼叫 document.write 會「插入」而不是「取代」，造成空白或疊畫面；等載入完成再換頁
  if(document.readyState !== "complete"){ window.addEventListener("load", () => setTimeout(() => show(html), 0), {once:true}); return; }
  document.open(); document.write(html); document.close();
}
document.getElementById("eye").onclick = () => {
  const i = document.getElementById("pw"); const t = i.type === "password";
  i.type = t ? "text" : "password"; document.getElementById("eye").textContent = t ? "隱藏" : "顯示";
};
async function login(){
  const err = document.getElementById("err"), go = document.getElementById("go");
  go.disabled = true; go.textContent = "驗證中…"; err.textContent = "";
  try{
    const raw = await deriveRaw(document.getElementById("pw").value);
    const html = await decrypt(raw);
    if(document.getElementById("rem").checked){
      try{ localStorage.setItem(AK, JSON.stringify({k:e64(raw), t:Date.now()+30*864e5})); }catch(_){}
    }
    try{ show(html); }catch(_){ err.textContent = "此預覽視窗無法開啟網站，請下載後用 Chrome 或 Safari 開啟。"; go.disabled = false; go.textContent = "進入"; }
  }catch(_){
    err.textContent = "通行碼不正確，請再試一次。"; go.disabled = false; go.textContent = "進入";
  }
}
document.getElementById("go").addEventListener("click", login);
document.getElementById("pw").addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); login(); } });
(async () => {
  try{
    const s = JSON.parse(localStorage.getItem(AK) || "null");
    if(s && s.t > Date.now()) show(await decrypt(d64(s.k)));
    else if(s) localStorage.removeItem(AK);
  }catch(_){ try{ localStorage.removeItem(AK); }catch(__){} }
})();
</script>
