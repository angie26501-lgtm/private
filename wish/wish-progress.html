<!DOCTYPE html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="googlebot" content="noindex, nofollow, noarchive">

<title>【客戶版】馥芸財富學苑｜服務進度時間軸｜WISH</title>
<style>
:root{--ink:#1f2d33;--sub:#5b6b72;--line:#d5dfe2;--paper:#f6f9f9;--card:#ffffff;
 --deep:#1d5a6e;--water:#3f8fa6;--mist:#dcebef;--amber:#b7791f;--amberbg:#fbf3e4;
 --gold:#c9a445;--green:#2f6b52;--red:#8f4a38}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:#eef4f5;color:var(--ink);font:16px/1.8 "Microsoft JhengHei","Noto Sans TC","PingFang TC",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:980px;margin:0 auto;padding:30px 18px 60px}
.hd{background:var(--card);border-radius:12px;padding:26px 28px 22px;border-top:5px solid var(--deep);
 box-shadow:0 2px 14px rgba(29,90,110,.09)}
.hd .k{font-size:12.5px;letter-spacing:.22em;color:var(--amber);font-weight:700}
.hd h1{margin:8px 0 0;font-size:27px;line-height:1.35;color:var(--deep)}
.hd .sb{margin:6px 0 0;font-size:16px;color:var(--water);font-weight:700}
.hd .mt{display:flex;flex-wrap:wrap;gap:5px 22px;margin-top:15px;padding-top:13px;
 border-top:1px solid var(--line);font-size:13px;color:var(--sub)}.hd .mt b{color:var(--deep)}
h2{font-size:21px;color:var(--deep);margin:36px 0 8px;padding-left:13px;border-left:5px solid var(--amber);line-height:1.5}
h3{font-size:17.5px;color:var(--deep);margin:26px 0 6px}
.small{font-size:13px;color:var(--sub)}
.lead{font-size:16.5px;margin:12px 0}
.note{background:var(--amberbg);border-radius:8px;padding:12px 16px;font-size:14.5px;
 margin:12px 0;color:#5a4012;line-height:1.85}
.note b{color:#7a5410}
.note.d{background:var(--paper);border:1px solid var(--line);color:var(--ink);border-left:5px solid var(--deep)}
.note.d b{color:var(--deep)}
.note.r{background:#fbeeea;border-left:5px solid var(--red);color:#5c2f23}.note.r b{color:var(--red)}
.note.g{background:#ecf4ef;border-left:5px solid var(--green);color:#24503f}.note.g b{color:var(--green)}
.edu{margin:8px 0 0!important}
.edu a{display:inline-block;font-size:13.8px;color:var(--deep);font-weight:700;
 background:var(--mist);border-radius:8px;padding:5px 11px;margin:4px 5px 0 0;text-decoration:none}
.edu a:hover{background:#c7e0e8}
.edu a:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* 水庫卡 */
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0;align-items:start}
.rescard{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--deep);
 border-radius:10px;padding:13px;cursor:pointer;position:relative}
.rescard.sm{border-top-color:var(--water)}.rescard.b2{border-top-color:#2d7489}
.rescard.lv{border-top-color:var(--green)}.rescard.b1{border-top-color:var(--gold)}
.rescard:hover,.rescard:focus-visible{box-shadow:0 8px 22px rgba(29,90,110,.16);border-color:var(--deep)}
.rescard:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.rescard .rn{display:inline-block;font-size:12.5px;font-weight:700;color:#fff;background:var(--deep);
 border-radius:12px;padding:0 10px;margin-bottom:6px}
.rescard.sm .rn{background:var(--water)}.rescard.b2 .rn{background:#2d7489}
.rescard.lv .rn{background:var(--green)}.rescard.b1 .rn{background:var(--gold)}
.rescard b{display:block;color:var(--deep);font-size:15.5px;line-height:1.5}
.rescard .amt{font-size:19px;font-weight:800;color:var(--deep);margin-top:3px}
.rescard .amt i{font-style:normal;font-size:12.5px;color:var(--sub);font-weight:600;margin-left:4px}
.rescard p{margin:5px 0 0;font-size:13.8px;color:var(--sub);line-height:1.75}
.rescard .more{display:block;margin-top:8px;font-size:13px;font-weight:700;color:var(--deep);opacity:.6}
.rescard:hover .more,.rescard.open .more{opacity:1}
.rtip{margin-top:10px;background:#12343f;color:#fff;border-radius:11px;padding:13px 15px;
 text-align:left;display:none}
.rescard.open .rtip{display:block}
.rtip b{display:block;color:#ffd98a;font-size:14.5px;margin-bottom:8px}
.rtip ul{margin:0;padding:0;list-style:none}
.rtip li{font-size:13.2px;line-height:1.65;margin:0 0 7px;display:flex;gap:8px}
.rtip li i{flex:none;width:58px;font-style:normal;color:#9fd0dd;font-size:12.2px}
.rtip .tipgo{display:block;margin-top:3px;padding-top:8px;border-top:1px solid rgba(255,255,255,.22);
 font-size:12.2px;color:#ffd98a;font-weight:700}

/* 階段 */
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}
.ph{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.8}
.ph strong{display:block;color:var(--deep);font-size:15.5px;margin-bottom:4px}
.ph strong i{font-style:normal;color:var(--amber)}

/* 時間軸 */
.tl{background:var(--card);border-radius:10px;padding:12px 10px 16px;margin:16px 0;border:1px solid var(--line)}
.tlbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin:0 4px 6px}
.tlbar .lb{font-size:13.5px;color:var(--sub);font-weight:700}
.tlbar .seg button{font-size:13.5px;padding:4px 13px;border-radius:14px;border:1px solid var(--line);
 background:#fff;color:var(--deep);cursor:pointer;font-family:inherit;font-weight:700;margin-left:5px}
.tlbar .seg button[aria-pressed=true]{background:var(--deep);border-color:var(--deep);color:#fff}
.zoombtn{font-size:13px;padding:4px 12px;border-radius:14px;border:1px solid var(--deep);
 background:#fff;color:var(--deep);cursor:pointer;font-family:inherit}
.zoombtn[aria-pressed=true]{background:var(--deep);color:#fff}
.tlscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:8px}
.tlscroll svg{display:block;width:100%;height:auto}
.tlscroll.zoom svg{width:1280px;max-width:none}
.tlscroll:focus-visible{outline:3px solid var(--amber)}
.slider{display:flex;align-items:center;gap:12px;margin:6px 6px 10px;padding:8px 12px;
 background:var(--paper);border:1px solid var(--line);border-radius:10px}
.slider input{flex:1;accent-color:var(--deep);height:28px}
.agebig{font-family:"Noto Serif TC","Songti TC",serif;font-size:26px;color:var(--deep);min-width:80px;text-align:right}
.agemark{position:sticky;top:0;z-index:12;display:flex;align-items:baseline;gap:14px;
 flex-wrap:wrap;margin:12px 6px 0;padding:10px 15px;border-radius:10px;
 background:var(--deep);color:#fff;box-shadow:0 5px 14px -9px rgba(10,40,50,.65)}
.agemark .a{font-family:"Noto Serif TC","Songti TC",serif;font-size:22px;
 font-weight:700;letter-spacing:.02em;line-height:1.3}
.agemark .y{font-size:13.5px;opacity:.85;letter-spacing:.02em}
.agemark .k{font-size:13px;opacity:.8}
.agemark .p{margin-left:auto;font-size:13px;font-weight:700;
 background:rgba(255,255,255,.2);border-radius:7px;padding:3px 12px;letter-spacing:.05em}
@media(max-width:560px){.agemark{gap:9px}.agemark .p{margin-left:0}}
@media print{.agemark{position:static}}
.panes{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px}
.pane{background:var(--paper);border-radius:8px;padding:10px 12px;font-size:13.5px;color:var(--sub)}
.pane b{display:block;font-size:17.5px;color:var(--deep);margin-top:2px}
.pane .phase{font-size:12.5px;color:var(--amber);font-weight:700}
.cfnow{margin:10px 6px 0;padding:9px 13px;border-left:4px solid var(--deep);background:var(--paper);
 border-radius:0 8px 8px 0;font-size:14.5px;line-height:1.85}.cfnow b{color:var(--deep)}
.cflegend,.goals{margin:10px 6px 4px;padding:10px 13px;background:var(--paper);border-radius:8px;border:1px solid var(--line)}
.goals-title{color:var(--deep);font-weight:700;cursor:pointer;font-size:14.5px}
.lg{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:7px 0;line-height:1.8}
.lb2{flex:none;width:24px;height:24px;border-radius:50%;color:#fff;font-weight:700;display:flex;
 align-items:center;justify-content:center;font-size:13px;margin-top:3px}
.goal{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:7px 0;line-height:1.8}
.gage{flex:none;background:var(--amber);color:#fff;border-radius:12px;padding:1px 11px;font-weight:700;
 font-size:13px;margin-top:3px;white-space:nowrap}
.gage.r{background:var(--red)}.gage.g{background:var(--green)}
.ft{margin-top:42px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--sub);line-height:2}
.ft b{color:var(--deep)}
#gate{position:fixed;inset:0;background:var(--deep);display:flex;align-items:center;justify-content:center;z-index:99}
#gate .bx{background:var(--card);border-radius:14px;padding:30px 32px;max-width:350px;width:88%;text-align:center}
#gate h3{margin:0 0 6px;color:var(--deep);font-size:18px}#gate p{margin:0 0 14px;font-size:14px;color:var(--sub)}
#gate input{width:100%;padding:11px;font-size:19px;text-align:center;border:2px solid var(--line);
 border-radius:8px;font-family:inherit;letter-spacing:.3em}
#gate button{margin-top:11px;width:100%;padding:11px;background:var(--deep);color:#fff;border:0;
 border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
#gate .er{color:var(--red);font-size:13px;margin-top:8px;min-height:18px}
@media(max-width:860px){.res{grid-template-columns:1fr 1fr}.panes{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.wrap{padding:18px 12px 44px}.hd h1{font-size:22px}h2{font-size:19px}
 .res,.phases,.panes{grid-template-columns:1fr}.agebig{font-size:22px;min-width:66px}}
@media print{#gate{display:none!important}body{background:#fff}.tlscroll{overflow:visible}
 .tlscroll.zoom svg{width:100%}.rtip{display:block!important}}
</style></head><body>
