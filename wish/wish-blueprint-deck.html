<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive"><meta name="googlebot" content="noindex, nofollow, noarchive">
<title>財顧芸｜人生財務設計藍圖報告書｜WISH</title>
<style>
:root{
  --deep:#1d5a6e; --water:#4a9db5; --amber:#c8862a; --amberbg:#fdf6e8;
  --paper:#f7f4ed; --card:#ffffff; --line:#e3ded4; --mist:#d9d3c7;
  --ink:#2b3338; --green:#3d7a55; --red:#b4553f; --grey:#6d7780;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:#20282d;color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%}
.serif{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif}

#gate{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;
  justify-content:center;z-index:99;flex-direction:column;gap:12px;padding:20px;text-align:center}
#gate input{font-size:18px;padding:8px 14px;border:1px solid var(--deep);border-radius:8px;width:180px;text-align:center}
#gate button{font-size:15px;padding:8px 22px;border-radius:8px;border:none;background:var(--deep);color:#fff;cursor:pointer}
#deck{display:none}

/* ---- slide frame ---- */
.stage{width:100%;max-width:1180px;margin:0 auto;padding:12px}
.slide{display:none;background:var(--paper);border-radius:12px;
  min-height:min(64vw,660px);padding:32px 42px 50px;position:relative;
  flex-direction:column}
.slide.on{display:flex}
.slide .kicker{font-size:12.5px;letter-spacing:.14em;color:var(--water);font-weight:700;margin-bottom:2px}
.slide h2{font-family:"Noto Serif TC","Songti TC",serif;font-size:27px;color:var(--deep);
  margin:0 0 4px;line-height:1.3}
.slide .dek{font-size:14px;color:var(--grey);margin:0 0 14px}
.slide .bodyarea{flex:1;min-height:0}
.pnum{position:absolute;right:20px;bottom:14px;font-size:12px;color:#9aa2a8}
.brandbar{position:absolute;left:44px;right:120px;bottom:14px;font-size:11.5px;color:#9aa2a8;
  border-top:1px solid var(--line);padding-top:6px}

/* ---- nav ---- */
.nav{max-width:1180px;margin:0 auto 26px;display:flex;align-items:center;gap:12px;
  padding:0 12px;color:#c6cfd4;font-size:13px;flex-wrap:wrap}
.nav button{background:#2f3a41;color:#dfe6ea;border:1px solid #435059;border-radius:8px;
  padding:5px 14px;cursor:pointer;font-size:13px}
.nav button:hover{background:#3b4750}
.dots{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.dots i{width:9px;height:9px;border-radius:50%;background:#48545c;cursor:pointer;display:block}
.dots i.on{background:var(--amber);transform:scale(1.25)}
.jump{background:#2f3a41;color:#dfe6ea;border:1px solid #435059;border-radius:8px;padding:5px 8px;font-size:13px}

/* ---- content atoms ---- */
.cover{justify-content:center;align-items:center;text-align:center;
  background:linear-gradient(160deg,#1d5a6e 0%,#17485a 55%,#123845 100%);color:#eaf2f4}
.cover h1{font-family:"Noto Serif TC","Songti TC",serif;font-size:40px;margin:0 0 6px;line-height:1.35;color:#fff}
.cover .sub{font-size:16px;color:#bcd6dd;margin-bottom:26px}
.cover .who{font-size:15px;color:#dceaee;line-height:2}
.cover .rule{width:70px;height:3px;background:var(--amber);margin:16px auto 22px;border-radius:2px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.box.t-deep{border-top:4px solid var(--deep)}
.box.t-amber{border-top:4px solid var(--amber)}
.box.t-red{border-top:4px solid var(--red)}
.box.t-green{border-top:4px solid var(--green)}
.box h4{margin:0 0 6px;font-size:14.5px;color:var(--deep)}
.box p{margin:0;font-size:13px;color:#5b656d;line-height:1.65}

.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;text-align:center}
.kpi .lab{font-size:12px;color:var(--grey)}
.kpi .val{font-family:"Noto Serif TC",serif;font-size:25px;color:var(--deep);line-height:1.3}
.kpi .val.g{color:var(--green)} .kpi .val.r{color:var(--red)} .kpi .val.a{color:var(--amber)}
.kpi .note{font-size:11.5px;color:#8a9299}

table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card)}
th,td{border:1px solid var(--line);padding:4px 9px;text-align:left;line-height:1.55}
th{background:var(--deep);color:#fff;font-weight:600;font-size:12.5px}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{background:var(--paper);font-weight:700}
tr.hl td{background:var(--amberbg)}

.obsbar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.ob{border-radius:8px;padding:8px 11px;font-size:12.5px;line-height:1.6;background:var(--card);
  border:1px solid var(--line)}
.ob b{display:block;font-size:12px;margin-bottom:2px}
.ob.o{border-left:3px solid var(--deep)} .ob.o b{color:var(--deep)}
.ob.w{border-left:3px solid var(--amber)} .ob.w b{color:var(--amber)}
.ob.a{border-left:3px solid var(--green)} .ob.a b{color:var(--green)}

.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:1px 7px;color:#fff}
.tag.red{background:var(--red)} .tag.amb{background:var(--amber)}
.tag.grn{background:var(--green)} .tag.dp{background:var(--deep)}
.tag.gy{background:#98a2a8}

ul.tight{margin:4px 0 0;padding-left:19px}
ul.tight li{margin:3px 0;font-size:13.5px}

/* family tree */
.tree{display:flex;flex-direction:column;align-items:center;gap:0;font-size:13px}
.tnode{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 14px;text-align:center;min-width:132px}
.tnode b{display:block;color:var(--deep);font-size:14px}
.tnode small{color:var(--grey);font-size:11.5px}
.tnode.self{border:2px solid var(--deep);background:#eef4f6}
.tnode.warn{border-color:var(--red);background:#fbeae6}
.tnode.gone{opacity:.72;border-style:dashed}
.trow{display:flex;gap:14px;justify-content:center}
.tline{width:2px;height:16px;background:var(--mist)}
.tbar{height:2px;background:var(--mist)}

/* letter */
.letter{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--amber);
  border-radius:0 10px 10px 0;padding:15px 22px;font-size:13.5px;line-height:1.92}
.letter p{margin:0 0 7px}
.letter .sign{text-align:right;color:var(--deep);font-family:"Noto Serif TC",serif;font-size:15px;margin-top:10px}
.quote{font-family:"Noto Serif TC",serif;font-size:18px;color:var(--amber);text-align:center;
  margin:12px 0 0;line-height:1.7}

.small{font-size:12px;color:var(--grey)}
.chartwrap{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
.chartwrap svg{width:100%;height:auto;display:block}

#noprt{display:none}
#adm{position:fixed;inset:0;z-index:300;background:rgba(10,30,38,.55);display:none;align-items:center;justify-content:center;padding:16px}
#adm .ab{background:#fff;border-radius:12px;border-top:6px solid #c8862a;padding:18px;width:min(360px,100%);font-family:inherit}
#adm h4{margin:0 0 6px;color:#1d5a6e}#adm p{margin:0 0 10px;font-size:13px;color:#555}
#adm input{width:100%;box-sizing:border-box;font-size:17px;padding:9px;border:2px solid #e3ded4;border-radius:8px}
#adm .row{display:flex;gap:8px;margin-top:10px}#adm button{flex:1;min-height:42px;border-radius:8px;border:2px solid #1d5a6e;background:#fff;color:#1d5a6e;font-weight:700;cursor:pointer}
#adm button.ok{background:#1d5a6e;color:#fff}#adm .er{color:#b4553f;font-size:13px;min-height:18px;margin-top:6px}
@media print{body:not(.prt-ok) #deck,body:not(.prt-ok) #gate{display:none!important}
 body:not(.prt-ok) #noprt{display:block!important;font-size:18px;padding:40px 20px;text-align:center;color:#333}#adm{display:none!important}}
@media print{
  body{background:#fff}
  .nav,#gate{display:none!important}
  #deck{display:block!important}
  .stage{max-width:none;padding:0}
  .slide{display:flex!important;break-after:page;page-break-after:always;border-radius:0;
    min-height:0;box-shadow:none;padding:18px 22px 30px}
}
@media(max-width:820px){
  .slide{min-height:0;padding:22px 20px 44px}
  .slide h2{font-size:22px}
  .grid2,.grid3,.grid4,.obsbar{grid-template-columns:1fr}
  .cover h1{font-size:27px}
}

/* 時間軸滑桿 */
.tlbar{display:flex;align-items:center;gap:14px;margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 14px}
.tlbar .cap{font-size:12px;color:var(--grey);white-space:nowrap}
.tlbar input[type=range]{flex:1;accent-color:#1d5a6e;height:20px;cursor:pointer}
.tlbar .age{font-family:"Noto Serif TC",serif;font-size:21px;color:var(--deep);min-width:74px;text-align:center;font-weight:700}
.tlout{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.tlout>div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 9px;text-align:center}
.tlout .l{font-size:11px;color:var(--grey);margin-bottom:2px}
.tlout .v{font-size:15px;font-weight:700;color:var(--deep)}
.tlout .v.sm{font-size:13.5px}
.tlout .v.neg{color:var(--red)} .tlout .v.pos{color:var(--green)}
.tlnote{margin-top:8px;background:#fff;border-left:4px solid var(--water);border-radius:8px;
  padding:9px 13px;font-size:12.5px;line-height:1.75;color:#3a4a52;min-height:38px}
.tlnote b{color:var(--deep)}
.famtree{background:linear-gradient(180deg,#fbfaf6,#f4f1ea);border:1px solid var(--line);border-radius:14px;padding:10px 10px 6px}.famtree svg{width:100%;height:auto;display:block}.famtree .ftm{display:none}@media(max-width:600px){.famtree .ftd{display:none}.famtree .ftm{display:block}}@media print{.famtree{break-inside:avoid;padding:4px}.famtree .ftd{display:block!important;max-height:58mm;margin:0 auto}.famtree .ftm{display:none!important}}
</style>
</head>
