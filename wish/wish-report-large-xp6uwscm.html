<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>【客戶版・大字】財顧芸｜WISH 先生 人生財務設計 周年檢視報告書</title>
<style>
:root{
 --ink:#121212;        /* 正文：接近純黑，對比 > 15:1 */
 --ink2:#3C3C3C;
 --deep:#0F4454;       /* 主色 深藍綠 */
 --deep2:#176578;      /* 主色亮階 */
 --gold:#A9821F;       /* 金線 */
 --gold2:#C9A445;
 --amb:#8A5A10;
 --red:#9B2C20;
 --green:#1D5A3C;
 --line:#D7D0C2;
 --line2:#EDE7DA;
 --paper:#FDFBF6;      /* 米白紙感 */
 --card:#FFFFFF;
 --band:#EFF5F7;
 --base:21px;
 --sh:0 2px 4px rgba(18,38,46,.05),0 8px 22px rgba(18,38,46,.07);
 --shl:0 1px 3px rgba(18,38,46,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
 font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
 font-size:var(--base);line-height:2.0;letter-spacing:.02em;
 -webkit-text-size-adjust:100%;
 background-image:radial-gradient(circle at 12% 0%,rgba(15,68,84,.045),transparent 42%),
  radial-gradient(circle at 88% 8%,rgba(169,130,31,.05),transparent 38%);
 background-attachment:fixed}
.srf{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif}
.wrap{max-width:880px;margin:0 auto;padding:22px 20px 130px}
h1{font-size:1.75em;line-height:1.45;color:var(--deep);margin:14px 0 6px;font-weight:800}
h2{font-size:1.24em;color:var(--deep);margin:0;font-weight:800;line-height:1.5;
 letter-spacing:.03em}
h3{font-size:1.06em;color:var(--deep);margin:28px 0 8px;font-weight:800;
 padding-left:13px;border-left:5px solid var(--gold2)}
p{margin:12px 0}
.lead{font-size:1.04em}
.sub{color:var(--ink2);font-size:.85em;line-height:1.85}
b,strong{font-weight:800}
.key{color:var(--red);font-weight:800;background:#FBE6E2;border-radius:6px;padding:2px 9px;
 box-decoration-break:clone;-webkit-box-decoration-break:clone}
/* ── 控制列 ───────────────────────────── */
.ctl{position:sticky;top:0;z-index:40;color:#fff;
 background:linear-gradient(135deg,var(--deep) 0%,var(--deep2) 100%);
 display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 18px;
 box-shadow:0 3px 16px rgba(10,40,50,.26);
 border-bottom:3px solid var(--gold2)}
.ctl .t{font-size:.76em;font-weight:800;flex:1;min-width:142px;line-height:1.5;
 letter-spacing:.08em}
.ctl button{min-height:50px;min-width:62px;border:2px solid rgba(255,255,255,.5);
 background:rgba(255,255,255,.12);color:#fff;border-radius:11px;font-family:inherit;
 font-size:.79em;font-weight:800;cursor:pointer;padding:6px 14px;transition:.15s}
.ctl button:hover{background:rgba(255,255,255,.24)}
.ctl button[aria-pressed="true"]{background:#fff;color:var(--deep);border-color:#fff;
 box-shadow:0 2px 8px rgba(0,0,0,.2)}
.ctl button:focus-visible{outline:4px solid var(--gold2);outline-offset:2px}
/* ── 章節目錄 ─────────────────────────── */
.nav{margin:16px 0 4px;background:var(--card);border:2px solid var(--line);
 border-radius:16px;padding:16px 18px;box-shadow:var(--shl)}
.nav .nt{font-size:.82em;font-weight:800;color:var(--deep);letter-spacing:.16em;
 margin:0 0 12px;display:flex;align-items:center;gap:10px}
.nav .nt::after{content:"";flex:1;height:2px;
 background:linear-gradient(90deg,var(--gold2),transparent)}
.nav ol{list-style:none;margin:0;padding:0;display:grid;gap:8px;
 grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.nav a{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);
 border:2px solid var(--line2);border-radius:11px;padding:10px 12px;min-height:56px;
 font-size:.88em;line-height:1.5;font-weight:700;transition:.15s;background:#FCFCFA}
.nav a:hover{border-color:var(--deep);background:var(--band)}
.nav a:focus-visible{outline:4px solid var(--gold2);outline-offset:2px}
.nav a i{flex:none;font-style:normal;width:34px;height:34px;border-radius:9px;
 background:var(--deep);color:#fff;display:flex;align-items:center;justify-content:center;
 font-size:.86em;font-weight:800}
/* ── 章節 ─────────────────────────────── */
details.ch{background:var(--card);border:2px solid var(--line);border-radius:18px;
 margin:20px 0;overflow:hidden;box-shadow:var(--sh);scroll-margin-top:84px}
details.ch[open]{border-color:var(--deep2)}
summary.chh{list-style:none;cursor:pointer;display:flex;align-items:center;gap:15px;
 padding:19px 20px;min-height:78px;position:relative;
 background:linear-gradient(180deg,#F5FAFB 0%,var(--band) 100%);
 border-bottom:2px solid transparent}
details.ch[open] summary.chh{border-bottom-color:var(--line2)}
summary.chh::-webkit-details-marker{display:none}
summary.chh::after{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;
 background:linear-gradient(180deg,var(--gold2),var(--gold))}
summary.chh:hover{background:linear-gradient(180deg,#EFF7F9 0%,#E4EEF1 100%)}
summary.chh:focus-visible{outline:4px solid var(--gold2);outline-offset:-4px}
.chn{flex:none;width:54px;height:54px;border-radius:14px;color:#fff;
 background:linear-gradient(140deg,var(--deep2),var(--deep));
 display:flex;align-items:center;justify-content:center;font-size:.95em;font-weight:800;
 box-shadow:0 3px 9px rgba(15,68,84,.3);letter-spacing:.02em}
.chh .ar{flex:none;font-size:.9em;color:var(--deep);font-weight:800;
 width:40px;height:40px;border-radius:50%;background:#fff;border:2px solid var(--line);
 display:flex;align-items:center;justify-content:center}
details.ch[open] .ar::after{content:"\2212"}
details.ch:not([open]) .ar::after{content:"\002B"}
.chb{padding:8px 24px 28px}
/* ── 大數字卡 ─────────────────────────── */
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(236px,1fr));gap:15px;margin:18px 0}
.big div{background:var(--card);border:2px solid var(--line2);border-radius:14px;
 padding:19px 20px 17px;position:relative;overflow:hidden;box-shadow:var(--shl)}
.big div::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;
 background:linear-gradient(90deg,var(--deep2),var(--deep))}
.big .g::before{background:linear-gradient(90deg,#2C8358,var(--green))}
.big .r::before{background:linear-gradient(90deg,#C04A3C,var(--red))}
.big .a::before{background:linear-gradient(90deg,var(--gold2),var(--amb))}
.big b{display:block;font-size:1.92em;line-height:1.25;color:var(--deep);font-weight:800;
 font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.big span{display:block;font-size:.81em;color:var(--ink2);margin-top:6px;line-height:1.65}
.big .g b{color:var(--green)} .big .r b{color:var(--red)} .big .a b{color:var(--amb)}
/* ── 條列（取代表格） ─────────────────── */
ul.rows{list-style:none;margin:16px 0;padding:0;border:2px solid var(--line2);
 border-radius:13px;overflow:hidden;background:var(--card)}
ul.rows li{display:flex;justify-content:space-between;gap:16px;align-items:baseline;
 padding:14px 16px;border-bottom:1px solid var(--line2)}
ul.rows li:nth-child(odd){background:#FBFAF7}
ul.rows li:last-child{border-bottom:0}
ul.rows .n{flex:1}
ul.rows .v{flex:none;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
ul.rows li.tot{border-top:3px solid var(--deep);border-bottom:0;background:var(--band)}
ul.rows li.tot .n,ul.rows li.tot .v{font-weight:800;font-size:1.06em;color:var(--deep)}
/* ── 補充資料 ── */
.xtra{margin:34px 0 6px}
.xh{font-size:1.02em;font-weight:800;color:var(--deep);letter-spacing:.1em;
 padding-bottom:9px;border-bottom:3px solid var(--gold2);margin-bottom:15px}
a.xc{display:block;background:var(--card);border:2px solid var(--line2);
 border-left:9px solid var(--gold2);border-radius:0 15px 15px 0;padding:19px 23px;
 text-decoration:none;color:inherit;box-shadow:var(--shl)}
a.xc:hover,a.xc:focus-visible{border-color:var(--deep);border-left-color:var(--deep);background:#fff}
a.xc:focus-visible{outline:4px solid var(--amb);outline-offset:3px}
.xt{display:block;font-size:1.14em;font-weight:800;color:var(--deep);line-height:1.5}
.xd{display:block;margin-top:8px;line-height:1.88}
.xg{display:block;margin-top:13px;padding-top:11px;border-top:2px dashed var(--line2);
 font-size:.9em;font-weight:800;color:var(--amb)}
@media print{a.xc{box-shadow:none}}
/* ── 章末落款 ── */
.sig{margin-top:30px;padding-top:20px;text-align:right;position:relative}
.sig::before{content:"";position:absolute;top:0;right:0;width:132px;height:3px;
 background:linear-gradient(90deg,transparent,var(--gold2))}
.sig .org{font-size:.86em;line-height:1.75;color:#5A6469}
.sig .nm{margin:9px 0 7px;font-size:1.28em;font-weight:800;color:var(--deep);letter-spacing:.06em}
.sig .cert{font-size:.78em;line-height:1.7;color:#7A838A;letter-spacing:.01em}
.sig .dt{margin-top:11px;font-size:.78em;color:#9AA3A8;letter-spacing:.04em}
/* ── 待辦清單勾選 ── */
.tdbox{margin-top:18px;border:3px solid var(--deep);border-radius:14px;overflow:hidden;background:#fff}
.tdhd{background:var(--deep);color:#fff;padding:14px 18px;font-weight:800;font-size:1.02em;
 display:flex;justify-content:space-between;align-items:center;gap:12px;letter-spacing:.03em}
.tdhd #tdcnt{font-size:.9em;background:rgba(255,255,255,.2);border-radius:9px;padding:4px 12px}
.tdg{padding:13px 18px 10px;background:#F4EFE4;border-bottom:2px solid var(--line2);
 font-weight:800;color:var(--deep);font-size:.9em;line-height:1.7}
.tdg .gs{display:block;margin-top:4px;font-weight:400;font-size:.88em;color:#6B6054;line-height:1.75}
.tdg .gs b{color:var(--amb);font-weight:800}
.td{display:block;padding:14px 18px;border-bottom:1px solid var(--line2);cursor:pointer}
.td:hover{background:#F3EFE4}
.td:has(input:checked){background:#EAF2EE}
.td .ro{display:flex;gap:13px;align-items:flex-start}
.td input{flex:none;width:1.5em;height:1.5em;accent-color:var(--deep);margin:.15em 0 0}
.td .tx{flex:1;font-size:.95em;line-height:1.8}
.td .tx b{color:var(--deep)}
.td:has(input:checked) .tx{color:#5A6469}
.td .wh{display:inline-block;margin-left:8px;font-size:.8em;background:var(--gold2);color:#fff;
 border-radius:5px;padding:2px 8px;font-weight:800;white-space:nowrap}
.tdn{padding:15px 18px;border-bottom:1px solid var(--line2)}
.tdn label{display:block;font-weight:800;color:var(--deep);font-size:.9em;margin-bottom:9px}
.tdn textarea{width:100%;border:2.5px solid var(--line2);border-radius:11px;padding:12px 14px;
 font-family:inherit;font-size:.92em;line-height:1.8;resize:vertical;background:#fff;color:var(--ink)}
.tdn textarea:focus{outline:3px solid var(--gold2);outline-offset:1px;border-color:var(--deep)}
.tdft{display:flex;gap:12px;padding:15px 18px;background:#F4EFE4;flex-wrap:wrap}
.tdft button{flex:1 1 150px;min-height:54px;border-radius:11px;font-family:inherit;
 font-size:.92em;font-weight:800;cursor:pointer;border:2.5px solid var(--deep)}
#tdcopy{background:var(--deep);color:#fff}
#tdcopy.ok{background:var(--green);border-color:var(--green)}
#tdclr{background:#fff;color:var(--deep)}
.tdout{display:none;padding:15px 18px;background:#EAF2EE;border-top:2px solid var(--line2);
 font-size:.88em;line-height:1.9;white-space:pre-wrap;word-break:break-word}
.tdout.on{display:block}
@media print{.tdft,.tdout{display:none!important}}
/* ── 逐年試算明細表 ── */
.yctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 8px}
.yctl .lb{font-weight:800;color:var(--deep);font-size:.9em;margin-right:4px}
.yctl button{min-height:50px;border:2.5px solid var(--deep);background:#fff;color:var(--deep);
 border-radius:11px;padding:10px 22px;font-family:inherit;font-size:.86em;font-weight:800;cursor:pointer}
.yctl button[aria-pressed="true"]{background:var(--deep);color:#fff}
.ywrap{margin-top:12px;border:3px solid var(--deep);border-radius:13px;overflow:auto;background:#fff;
 -webkit-overflow-scrolling:touch;max-height:none}
table.ytb{width:100%;min-width:760px;border-collapse:collapse;font-size:.64em;
 font-variant-numeric:tabular-nums}
table.ytb th,table.ytb td{padding:11px 9px;text-align:right;border-bottom:1px solid var(--line2);
 white-space:nowrap}
table.ytb thead th{background:var(--deep);color:#fff;font-weight:800;font-size:.95em;
 line-height:1.4;vertical-align:bottom}
table.ytb thead th.grp{border-left:2px solid rgba(255,255,255,.35)}
table.ytb th.ag,table.ytb td.ag{text-align:left;font-weight:800;color:var(--deep);background:#fff}
table.ytb thead th.ag{background:var(--deep);color:#fff}
table.ytb td.ag .ic{display:inline-block;width:1.7em;height:1.7em;line-height:1.55em;text-align:center;
 border-radius:50%;border:2px solid var(--deep);font-size:.95em;margin-right:8px;background:#fff}
table.ytb td.ag i{display:inline-block;margin-left:7px;font-style:normal;font-size:.8em;
 background:var(--gold2);color:#fff;border-radius:5px;padding:2px 7px;font-weight:800}
table.ytb tbody tr.yr{cursor:pointer}
table.ytb tbody tr.yr:hover td,table.ytb tbody tr.yr:hover td.ag{background:#F3EFE4}
table.ytb tbody tr.yr.on td,table.ytb tbody tr.yr.on td.ag{background:#EAF2EE}
table.ytb tbody tr.yr.on td.ag .ic{background:var(--deep);color:#fff}
table.ytb tbody tr.yr.key td,table.ytb tbody tr.yr.key td.ag{background:#FBF2E2;color:var(--amb)}
table.ytb tbody tr.yr.sub td,table.ytb tbody tr.yr.sub td.ag{background:#F2F6F8}
table.ytb td.tt{font-weight:800;color:var(--deep);border-left:2px solid var(--line2)}
table.ytb td.g{color:var(--green);font-weight:800}
table.ytb td.r{color:var(--red);font-weight:800}
table.ytb tbody tr.yd{display:none}
table.ytb tbody tr.yd.on{display:table-row}
table.ytb tbody tr.yd td{padding:0;background:#F6F2E8;border-bottom:2px solid var(--line2)}
.yw{display:grid;grid-template-columns:1fr 1fr}
.yc{padding:15px 20px;border-right:1px solid var(--line2)}
.yc:last-child{border-right:0}
.yc h5{margin:0 0 10px;font-size:1.3em;color:var(--deep);font-weight:800;line-height:1.5}
.yc ul{list-style:none;margin:0;padding:0}
.yc li{display:flex;justify-content:space-between;gap:16px;padding:8px 0;
 border-bottom:1px dashed var(--line2);font-size:1.18em;line-height:1.7}
.yc li:last-child{border-bottom:0}
.yc li b{white-space:nowrap;color:var(--ink)}
.yleg{display:flex;gap:18px;flex-wrap:wrap;margin-top:11px;font-size:.84em;color:#5A6469}
.yleg i{font-style:normal;background:var(--gold2);color:#fff;border-radius:5px;
 padding:2px 7px;font-weight:800;margin-right:5px}
.yfoot{margin-top:10px;font-size:.86em;line-height:1.9;color:#5A6469}
.yfoot b{color:var(--deep)}
@media(max-width:820px){ .yw{grid-template-columns:1fr}
 .yc{border-right:0;border-bottom:1px solid var(--line2)} }
@media print{
 .yctl{display:none!important}
 .ywrap{overflow:visible;border-width:2px}
 table.ytb{min-width:0;font-size:.5em}
 table.ytb tbody tr.yd{display:table-row!important}
 .yc h5{font-size:1.1em}.yc li{font-size:1em}
}
/* ── 健康告知初步勾選表 ── */
.hbox{margin-top:20px;border:3px solid var(--deep);border-radius:14px;overflow:hidden;background:#fff}
.hhd{background:var(--deep);color:#fff;padding:14px 18px;font-weight:800;font-size:1.02em;letter-spacing:.04em}
.hin{padding:13px 18px;background:#F4EFE4;border-bottom:2px solid var(--line2);font-size:.9em;line-height:1.9}
.hq{padding:15px 18px;border-bottom:1px solid var(--line2)}
.hq:nth-of-type(even){background:#FBFAF7}
.hq .qt{font-size:.95em;line-height:1.85;margin-bottom:11px}
.hq .qa{display:flex;gap:12px;flex-wrap:wrap}
.hq .qa label{flex:0 0 auto;display:inline-flex;align-items:center;gap:9px;
 border:2.5px solid var(--line2);border-radius:11px;padding:11px 24px;cursor:pointer;
 font-weight:800;font-size:.95em;background:#fff;min-height:52px}
.hq .qa label:hover{border-color:var(--water)}
.hq .qa input{width:1.35em;height:1.35em;accent-color:var(--deep);margin:0}
.hq .qa label:has(input:checked){border-color:var(--deep);background:#EAF2EE;color:var(--deep)}
.hq .qa label:has(input[value="是"]:checked){border-color:var(--amb);background:#FBF2E2;color:var(--amb)}
.hq textarea{width:100%;border:2.5px solid var(--line2);border-radius:11px;padding:12px 14px;
 font-family:inherit;font-size:.92em;line-height:1.8;resize:vertical;background:#fff;color:var(--ink)}
.hq textarea:focus{outline:3px solid var(--gold2);outline-offset:1px;border-color:var(--deep)}
.hft{display:flex;gap:12px;padding:15px 18px;background:#F4EFE4;flex-wrap:wrap}
.hft button{flex:1 1 150px;min-height:54px;border-radius:11px;font-family:inherit;
 font-size:.92em;font-weight:800;cursor:pointer;border:2.5px solid var(--deep)}
#hcopy{background:var(--deep);color:#fff}
#hcopy:hover{background:var(--deep2)}
#hcopy.ok{background:var(--green);border-color:var(--green)}
#hclr{background:#fff;color:var(--deep)}
.hout{display:none;padding:15px 18px;background:#EAF2EE;border-top:2px solid var(--line2);
 font-size:.9em;line-height:1.9;white-space:pre-wrap;word-break:break-word}
.hout.on{display:block}
.hdis{padding:14px 18px;background:#FBF2E2;border-top:2px solid var(--line2);
 font-size:.84em;line-height:1.85;color:#6B5633}
.hdis b{color:var(--amb)}
@media print{
 .hft,.hout{display:none!important}
 .hq .qa label{padding:8px 18px;min-height:0}
}
details.ref{margin-top:14px;border:2px solid var(--line2);border-radius:11px;
 background:#fff;overflow:hidden}
details.ref>summary{cursor:pointer;list-style:none;padding:13px 16px;
 font-weight:800;color:var(--deep);display:flex;align-items:center;gap:11px}
details.ref>summary::-webkit-details-marker{display:none}
details.ref>summary::before{content:"＋";flex:none;width:1.75em;height:1.75em;
 line-height:1.7em;text-align:center;border-radius:50%;border:2.5px solid var(--deep);
 font-size:.84em;background:#fff}
details.ref[open]>summary::before{content:"−";background:var(--deep);color:#fff}
details.ref>summary:hover{background:#F3EFE4}
details.ref>summary:focus-visible{outline:4px solid var(--gold2);outline-offset:-4px}
details.ref .rb{padding:4px 16px 16px;border-top:1px solid var(--line2)}
details.ref h5{margin:14px 0 7px;font-size:.92em;color:var(--deep);font-weight:800}
details.ref h5:first-child{margin-top:10px}
table.tx{width:100%;border-collapse:collapse;font-size:.88em;margin:6px 0}
table.tx th,table.tx td{padding:9px 10px;border-bottom:1px solid var(--line2);text-align:right}
table.tx th:first-child,table.tx td:first-child{text-align:left}
table.tx thead th{background:var(--band);color:var(--deep);font-weight:800}
table.tx tr.me td{background:#EAF2EE;font-weight:800}
details.ref ul.pl{margin:6px 0;padding-left:1.3em;font-size:.9em;line-height:1.95}
details.ref .src{margin-top:12px;font-size:.82em;color:var(--grey2,#5A6469);line-height:1.8}
ul.rows li.ex{cursor:pointer;gap:12px;position:relative}
ul.rows li.ex:hover{background:#F3EFE4}
ul.rows li.ex:focus-visible{outline:4px solid var(--gold2);outline-offset:-4px}
ul.rows li.ex .ic{flex:none;width:1.75em;height:1.75em;line-height:1.7em;text-align:center;
 border-radius:50%;border:2.5px solid var(--deep);color:var(--deep);
 font-weight:800;font-size:.84em;background:#fff}
ul.rows li.ex.on .ic{background:var(--deep);color:#fff}
ul.rows li.sb{display:none;padding:0;background:#F6F2E8;border-bottom:1px solid var(--line2)}
ul.rows li.sb.on{display:block}
ul.rows li.sb .sbl{list-style:none;margin:0;padding:4px 0}
ul.rows li.sb .sbl li{display:flex;justify-content:space-between;gap:16px;align-items:baseline;
 padding:10px 18px 10px 54px;border-bottom:1px dashed var(--line2);background:transparent;
 font-size:.93em;color:var(--grey2,#5A6469)}
