<title>吳O中｜醫療與重大傷病規劃說明</title>
<style>
:root{--gold:#E9A92A;--brown:#5E4A33;--blue:#1E6FB8;--green:#2e8b57;--orange:#E8923A;--red:#b3261e;--bg:#faf7f1;--line:#e8dfcf;--muted:#7a6f60}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:#2d2a26;font-size:15.5px;line-height:1.75}
a{color:var(--blue)}
/* 通行碼頁 */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#5E4A33,#8B6F4E);padding:18px}
.gcard{background:#fff;border-radius:14px;border-top:8px solid var(--gold);max-width:420px;width:100%;padding:22px 20px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.gcard h1{font-size:19px;margin:0 0 4px;color:var(--brown)}
.gcard .sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.gcard .pwrap input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:16px}
.pwrap{position:relative}
.pwrap input{padding-right:84px!important}
.gcard .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:auto;margin:0;padding:5px 10px;background:#FFF6E3;color:var(--brown);border:1px solid #F1D9A6;border-radius:6px;font-size:13px;font-weight:400}
.gcard button{width:100%;margin-top:10px;padding:10px;border:none;border-radius:8px;background:var(--gold);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.gcard label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-top:8px}
#gerr{color:var(--red);font-size:13px;min-height:18px;margin-top:6px}
.gmenu{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px;font-size:13px}
.gmenu b{color:var(--brown)}
.gmenu a{display:block;padding:3px 0;text-decoration:none}
.gtip{font-size:12px;color:var(--muted);margin-top:10px}
/* 內容 */
header{background:linear-gradient(135deg,#5E4A33,#8B6F4E);color:#fff;padding:22px 18px 18px}
header h1{margin:0;font-size:22px;letter-spacing:.05em}
header .sub{opacity:.9;font-size:14px}
.band{background:#2e8b57;color:#fff;font-size:12.5px;padding:4px 14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.band a{color:#fff}
nav.toc{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:6px 10px}
nav.toc a{white-space:nowrap;text-decoration:none;color:var(--brown);font-size:14px;padding:5px 10px;border-radius:16px;background:#FFF6E3;border:1px solid #F1D9A6}
main{max-width:920px;margin:0 auto;padding:14px}
section{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:14px 0;scroll-margin-top:56px}
h2{color:var(--blue);font-size:19px;margin:0 0 8px;letter-spacing:.05em}
h3{color:var(--brown);font-size:16px;margin:14px 0 6px}
h3::before{content:"➤ "}
.cream{background:#FFF7E6;border-left:5px solid var(--gold);border-radius:8px;padding:10px 12px;margin:10px 0}
.gray{background:#f1f2f4;border-radius:8px;padding:10px 12px;margin:10px 0;font-size:14px}
.green{background:#e9f6ee;border-left:5px solid var(--green);border-radius:8px;padding:10px 12px;margin:10px 0}
table{width:100%;border-collapse:separate;border-spacing:2px;font-size:14px}
th{background:#FFD98A;padding:6px;text-align:center}
td{background:#EEF1EC;padding:6px;text-align:center}
td:first-child{background:#FFEFD2;font-weight:700;text-align:left}
.tw{overflow-x:auto}
.over{color:var(--red);font-weight:700}
.ok{color:var(--green);font-weight:700}
.tag{display:inline-block;font-size:11px;border-radius:4px;padding:0 5px;color:#fff;vertical-align:1px}
.A{background:#2e8b57}.B{background:#1E6FB8}.C{background:#E8923A}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;position:relative}
.card.pick{border:2px solid var(--green)}
.card .badge{position:absolute;top:-10px;right:10px;background:var(--green);color:#fff;font-size:12px;border-radius:10px;padding:1px 8px}
.card h4{margin:0 0 4px;color:var(--brown);font-size:16px}
.card .price{font-size:22px;font-weight:700;color:var(--blue)}
.card ul{padding-left:18px;margin:6px 0;font-size:14px}
.bar{display:flex;align-items:center;gap:6px;font-size:13px;margin:3px 0}
.bar span.l{width:52px;flex:none;color:var(--muted)}
.bar i{display:block;height:14px;border-radius:4px}
.links a{display:inline-block;margin:4px 6px 4px 0;padding:6px 12px;border-radius:18px;background:#EAF2FB;border:1px solid #c7dbf2;text-decoration:none;font-size:14px}
.btn{display:inline-block;padding:10px 16px;border-radius:10px;background:#06C755;color:#fff!important;text-decoration:none;font-weight:700}
.btn2{display:inline-block;padding:8px 14px;border-radius:10px;background:#fff;border:1px solid var(--line);text-decoration:none;color:var(--brown)!important;font-size:14px}
ol.steps li{margin:6px 0}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px 14px 40px}
.top{position:fixed;right:14px;bottom:16px;background:var(--gold);color:#fff;border-radius:20px;padding:6px 12px;text-decoration:none;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
@media(max-width:760px){.cards{grid-template-columns:1fr}main{padding:8px}section{padding:14px 12px}table{font-size:13px}.tw table{min-width:520px}}
@media print{nav.toc,.top,.band{display:none}section{break-inside:avoid}}
.mbtn{position:fixed;top:8px;right:10px;z-index:30;background:var(--gold);color:#fff;border:none;border-radius:18px;padding:6px 14px;font:inherit;font-size:14px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer}
.mpanel{position:fixed;top:46px;right:10px;z-index:30;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:8px;min-width:240px;display:none}
.mpanel.on{display:block}
.mpanel a{display:block;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--brown);font-size:14px}
.mpanel a:hover,.mpanel a.cur{background:#FFF6E3}
.mpanel .sep{border-top:1px dashed var(--line);margin:6px 0}
@media print{.mbtn,.mpanel{display:none!important}}
</style>
